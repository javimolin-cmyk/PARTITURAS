<script>

/* ============================================================
   CONFIGURACIÓN
============================================================ */

const BASE =
"EXPERIENCE%20-%20%20Ludovico%20Einaudi/";

const ARCHIVOS = [
    "score_0.svg",
    "score_1.svg",
    "score_2.svg",
    "score_3.svg",
    "score_4.svg"
];

const estado = {

    paginas: [],

    midi: null

};


/* ============================================================
   UTILIDADES
============================================================ */

function log(texto){

    const elemento =
        document.getElementById("log");

    elemento.textContent +=
        texto + "\n";

    elemento.scrollTop =
        elemento.scrollHeight;

}


function limpiarLog(){

    document.getElementById("log").textContent =
        "";

}


function numero(valor){

    const n =
        parseFloat(valor);

    return Number.isFinite(n) ? n : 0;

}


/* ============================================================
   PARSER DE PATH SVG
============================================================ */

function obtenerBoundsPath(d){

    const tokens =
        d.match(
            /[a-zA-Z]|[-+]?(?:\d*\.\d+|\d+\.?)(?:e[-+]?\d+)?/ig
        ) || [];

    let i = 0;

    let x = 0;
    let y = 0;

    let comando = "";

    const xs = [];
    const ys = [];

    while(i < tokens.length){

        if(/[a-zA-Z]/.test(tokens[i])){

            comando =
                tokens[i++];

        }

        const c =
            comando.toLowerCase();

        const relativo =
            comando === c;

        try{

            if(c === "m" || c === "l"){

                const a =
                    numero(tokens[i++]);

                const b =
                    numero(tokens[i++]);

                if(relativo){

                    x += a;
                    y += b;

                }else{

                    x = a;
                    y = b;

                }

                xs.push(x);
                ys.push(y);

                if(c === "m"){

                    comando =
                        relativo ? "l" : "L";

                }

            }

            else if(c === "h"){

                const a =
                    numero(tokens[i++]);

                x =
                    relativo ? x + a : a;

                xs.push(x);
                ys.push(y);

            }

            else if(c === "v"){

                const a =
                    numero(tokens[i++]);

                y =
                    relativo ? y + a : a;

                xs.push(x);
                ys.push(y);

            }

            else if(c === "c"){

                for(let k=0;k<3;k++){

                    const a =
                        numero(tokens[i++]);

                    const b =
                        numero(tokens[i++]);

                    if(relativo){

                        x += a;
                        y += b;

                    }else{

                        x = a;
                        y = b;

                    }

                    xs.push(x);
                    ys.push(y);

                }

            }

            else if(c === "s" || c === "q"){

                for(let k=0;k<2;k++){

                    const a =
                        numero(tokens[i++]);

                    const b =
                        numero(tokens[i++]);

                    if(relativo){

                        x += a;
                        y += b;

                    }else{

                        x = a;
                        y = b;

                    }

                    xs.push(x);
                    ys.push(y);

                }

            }

            else if(c === "t"){

                const a =
                    numero(tokens[i++]);

                const b =
                    numero(tokens[i++]);

                if(relativo){

                    x += a;
                    y += b;

                }else{

                    x = a;
                    y = b;

                }

                xs.push(x);
                ys.push(y);

            }

            else if(c === "a"){

                /*
                 Arco SVG:
                 rx ry x-axis-rotation large-arc sweep x y
                */

                i += 5;

                const a =
                    numero(tokens[i++]);

                const b =
                    numero(tokens[i++]);

                if(relativo){

                    x += a;
                    y += b;

                }else{

                    x = a;
                    y = b;

                }

                xs.push(x);
                ys.push(y);

            }

            else if(c === "z"){

                comando = "";

            }

            else{

                i++;

            }

        }catch(error){

            break;

        }

    }

    if(!xs.length){

        return null;

    }

    const xmin =
        Math.min(...xs);

    const xmax =
        Math.max(...xs);

    const ymin =
        Math.min(...ys);

    const ymax =
        Math.max(...ys);

    return {

        x:xmin,
        y:ymin,

        x2:xmax,
        y2:ymax,

        width:xmax-xmin,
        height:ymax-ymin

    };

}


/* ============================================================
   SUBPATHS
============================================================ */

function obtenerSubpaths(path){

    const d =
        path.getAttribute("d") || "";

    const posiciones =
        [...d.matchAll(/[Mm]/g)]
        .map(x => x.index);

    const resultado = [];

    for(let i=0;i<posiciones.length;i++){

        const inicio =
            posiciones[i];

        const final =
            i + 1 < posiciones.length
            ? posiciones[i+1]
            : d.length;

        const fragmento =
            d.substring(
                inicio,
                final
            );

        const bounds =
            obtenerBoundsPath(
                fragmento
            );

        if(bounds){

            resultado.push(
                bounds
            );

        }

    }

    return resultado;

}


/* ============================================================
   DETECTAR CABEZAS
============================================================ */

function detectarCabezas(svg){

    const cabezas = [];

    svg
        .querySelectorAll(".Note")
        .forEach((elemento,indice)=>{

            const partes =
                obtenerSubpaths(
                    elemento
                );

            partes.forEach(bounds=>{

                /*
                 Las cabezas de las notas
                 de este SVG están dentro
                 de este rango geométrico.
                */

                if(
                    bounds.width >= 8 &&
                    bounds.width <= 90 &&
                    bounds.height >= 8 &&
                    bounds.height <= 90
                ){

                    cabezas.push({

                        x:
                            bounds.x +
                            bounds.width/2,

                        y:
                            bounds.y +
                            bounds.height/2,

                        width:
                            bounds.width,

                        height:
                            bounds.height,

                        origen:
                            indice

                    });

                }

            });

        });

    return cabezas;

}


/* ============================================================
   DETECTAR STAFFLINES
============================================================ */

function detectarLineas(svg){

    const lineas = [];

    svg
        .querySelectorAll(".StaffLines")
        .forEach(elemento=>{

            obtenerSubpaths(
                elemento
            ).forEach(bounds=>{

                if(bounds.width > 100){

                    lineas.push(bounds);

                }

            });

        });

    return lineas.sort(
        (a,b)=>a.y-b.y
    );

}


/* ============================================================
   AGRUPAR PENTAGRAMAS
============================================================ */

function detectarPentagramas(lineas){

    const grupos = [];

    for(const linea of lineas){

        let grupo = null;

        for(const g of grupos){

            if(
                Math.abs(
                    g.centro-linea.y
                ) < 80
            ){

                grupo = g;
                break;

            }

        }

        if(!grupo){

            grupo = {

                lineas:[],

                centro:linea.y,

                arriba:linea.y,

                abajo:linea.y

            };

            grupos.push(
                grupo
            );

        }

        grupo.lineas.push(
            linea
        );

        grupo.arriba =
            Math.min(
                grupo.arriba,
                linea.y
            );

        grupo.abajo =
            Math.max(
                grupo.abajo,
                linea.y
            );

        grupo.centro =
            (grupo.arriba+
             grupo.abajo)/2;

    }

    return grupos
        .sort(
            (a,b)=>
                a.centro-b.centro
        )
        .map(
            (g,i)=>({

                ...g,

                indice:i

            })
        );

}


/* ============================================================
   DETECTAR BARRAS
============================================================ */

function detectarBarras(svg){

    const posiciones = [];

    svg
        .querySelectorAll(".BarLine")
        .forEach(elemento=>{

            const bounds =
                obtenerBoundsPath(
                    elemento.getAttribute("d") || ""
                );

            if(
                bounds &&
                bounds.height > 20
            ){

                posiciones.push(
                    bounds.x
                );

            }

        });

    return [
        ...new Set(
            posiciones.map(
                x =>
                    Math.round(x*10)/10
            )
        )
    ].sort(
        (a,b)=>a-b
    );

}


/* ============================================================
   STAFF MÁS CERCANO
============================================================ */

function staffMasCercano(y,pentagramas){

    let mejor = null;

    let distancia =
        Infinity;

    for(const staff of pentagramas){

        let d;

        if(y < staff.arriba){

            d =
                staff.arriba-y;

        }

        else if(y > staff.abajo){

            d =
                y-staff.abajo;

        }

        else{

            d=0;

        }

        if(d < distancia){

            distancia=d;

            mejor=staff;

        }

    }

    return mejor;

}


/* ============================================================
   PITCH
============================================================ */

function obtenerPitch(y,staff){

    const espacio =
        Math.max(
            1,
            (staff.abajo-staff.arriba)/4
        );

    /*
     Cinco líneas = cuatro espacios.
     Medio espacio = una posición diatónica.
    */

    const pasos =
        Math.round(
            (staff.centro-y) /
            (espacio/2)
        );

    /*
     En este documento alternamos
     los pentagramas superior/inferior.

     Sol:
     línea central = B4 = MIDI 71

     Fa:
     línea central = D3 = MIDI 50
    */

    const claveFa =
        staff.indice % 2 === 1;

    const centro =
        claveFa
        ? 50
        : 71;

    /*
     Una posición diatónica
     aproximadamente equivale
     a 7 semitonos / 12 posiciones.
    */

    const pitch =
        centro +
        Math.round(
            pasos * 7/12
        );

    return Math.max(
        21,
        Math.min(
            108,
            pitch
        )
    );

}


/* ============================================================
   ASIGNAR NOTAS
============================================================ */

function asignarNotas(page){

    const notas = [];

    for(const cabeza of page.cabezas){

        const staff =
            staffMasCercano(
                cabeza.y,
                page.pentagramas
            );

        if(!staff){

            continue;

        }

        notas.push({

            ...cabeza,

            staff:
                staff.indice,

            pitch:
                obtenerPitch(
                    cabeza.y,
                    staff
                )

        });

    }

    notas.sort(
        (a,b)=>
            a.staff-b.staff ||
            a.x-b.x ||
            a.y-b.y
    );

    /*
     Agrupamos cabezas prácticamente
     verticales para detectar acordes.
    */

    const acordes = [];

    for(const nota of notas){

        let acorde =
            acordes.find(
                a =>
                    a.staff === nota.staff &&
                    Math.abs(
                        a.x-nota.x
                    ) < 12
            );

        if(!acorde){

            acorde = {

                staff:
                    nota.staff,

                x:
                    nota.x,

                notas:[]

            };

            acordes.push(
                acorde
            );

        }

        acorde.notas.push(
            nota
        );

    }

    return {

        notas,

        acordes

    };

}


/* ============================================================
   DURACIÓN ESTIMADA
============================================================ */

function estimarDuracion(
    acorde,
    todasLasNotas
){

    const mismas =
        todasLasNotas
        .filter(
            n =>
                n.staff ===
                acorde.staff
        )
        .sort(
            (a,b)=>a.x-b.x
        );

    const indice =
        mismas.findIndex(
            n =>
                Math.abs(
                    n.x-acorde.x
                ) < 12
        );

    let distancia=100;

    if(
        indice >= 0 &&
        indice < mismas.length-1
    ){

        distancia =
            Math.max(
                5,
                mismas[indice+1].x -
                acorde.x
            );

    }

    /*
     480 ticks = negra.

     La geometría horizontal
     se transforma en una primera
     estimación rítmica.
    */

    if(distancia < 35){

        return 120;

    }

    if(distancia < 70){

        return 240;

    }

    if(distancia < 130){

        return 480;

    }

    if(distancia < 230){

        return 960;

    }

    return 1920;

}


/* ============================================================
   MOSTRAR PÁGINA
============================================================ */

function mostrarPagina(page,indice){

    const contenedor =
        document.createElement(
            "div"
        );

    contenedor.className =
        "page";

    contenedor.innerHTML =

        "<h3>Página "+
        (indice+1)+
        "</h3>"+

        "<div class='small'>"+
        "Cabezas: "+
        page.cabezas.length+
        " · Líneas: "+
        page.lineas.length+
        " · Pentagramas: "+
        page.pentagramas.length+
        " · Barras: "+
        page.barras.length+
        " · Asignadas: "+
        page.asignadas.notas.length+
        "</div>";

    document
        .getElementById(
            "resultados"
        )
        .appendChild(
            contenedor
        );

}


/* ============================================================
   ANALIZAR
============================================================ */

async function analizar(){

    limpiarLog();

    document
        .getElementById(
            "resultados"
        )
        .innerHTML="";

    document
        .getElementById(
            "midi"
        )
        .disabled=true;

    document
        .getElementById(
            "descargar"
        )
        .disabled=true;

    estado.paginas=[];

    log(
        "▶ Iniciando reconstrucción musical..."
    );

    let totalCabezas=0;
    let totalPentagramas=0;
    let totalAsignadas=0;

    for(
        let i=0;
        i<ARCHIVOS.length;
        i++
    ){

        log(
            "📄 Página "+
            (i+1)+
            " / "+
            ARCHIVOS.length
        );

        try{

            const url =
                BASE+
                ARCHIVOS[i];

            log(
                "   "+
                ARCHIVOS[i]
            );

            const respuesta =
                await fetch(
                    url,
                    {
                        cache:"no-store"
                    }
                );

            if(!respuesta.ok){

                throw new Error(
                    "HTTP "+
                    respuesta.status
                );

            }

            const texto =
                await respuesta.text();

            const documento =
                new DOMParser()
                .parseFromString(
                    texto,
                    "image/svg+xml"
                );

            const svg =
                documento.documentElement;

            const page={

                texto,

                svg,

                cabezas:
                    detectarCabezas(
                        svg
                    ),

                lineas:
                    detectarLineas(
                        svg
                    ),

                pentagramas:[],

                barras:[],

                asignadas:null

            };

            page.pentagramas =
                detectarPentagramas(
                    page.lineas
                );

            page.barras =
                detectarBarras(
                    svg
                );

            page.asignadas =
                asignarNotas(
                    page
                );

            estado.paginas.push(
                page
            );

            totalCabezas +=
                page.cabezas.length;

            totalPentagramas +=
                page.pentagramas.length;

            totalAsignadas +=
                page.asignadas.notas.length;

            log(
                "   ✓ SVG cargado — "+
                texto.length+
                " caracteres"
            );

            log(
                "   .Note: "+
                svg.querySelectorAll(
                    ".Note"
                ).length
            );

            log(
                "   🔴 Cabezas: "+
                page.cabezas.length
            );

            log(
                "   📏 Líneas reales: "+
                page.lineas.length
            );

            log(
                "   🎼 Pentagramas: "+
                page.pentagramas.length
            );

            log(
                "   ✓ Asignadas: "+
                page.asignadas.notas.length
            );

            mostrarPagina(
                page,
                i
            );

        }

        catch(error){

            log(
                "   ❌ ERROR: "+
                error.message
            );

        }

    }

    document
        .getElementById(
            "stats"
        )
        .innerHTML=

        "<div class='stat'>"+
        "<b>"+
        estado.paginas.length+
        "</b><br>Páginas</div>"+

        "<div class='stat'>"+
        "<b>"+
        totalCabezas+
        "</b><br>Cabezas</div>"+

        "<div class='stat'>"+
        "<b>"+
        totalPentagramas+
        "</b><br>Pentagramas</div>"+

        "<div class='stat'>"+
        "<b>"+
        totalAsignadas+
        "</b><br>Asignadas</div>";

    log(
        "================================"
    );

    log(
        "✓ ANÁLISIS MUSICAL COMPLETADO"
    );

    log(
        "Total cabezas: "+
        totalCabezas
    );

    log(
        "Total pentagramas: "+
        totalPentagramas
    );

    log(
        "Total asignadas: "+
        totalAsignadas
    );

    if(totalAsignadas>0){

        document
            .getElementById(
                "midi"
            )
            .disabled=false;

    }

}


/* ============================================================
   VARIABLE LENGTH QUANTITY
============================================================ */

function VLQ(valor){

    let buffer =
        valor & 127;

    const bytes=[];

    while(
        (valor >>= 7)
    ){

        buffer <<= 8;

        buffer |=
            (valor & 127) |
            128;

    }

    while(true){

        bytes.push(
            buffer & 255
        );

        if(
            buffer & 128
        ){

            buffer >>= 8;

        }else{

            break;

        }

    }

    return bytes;

}


function U32(v){

    return [

        (v>>>24)&255,
        (v>>>16)&255,
        (v>>>8)&255,
        v&255

    ];

}


/* ============================================================
   GENERAR MIDI
============================================================ */

function generarMIDI(){

    const TPQ=480;

    const clusters=[];

    let tiempoPagina=0;

    /*
     Procesamos página por página.
    */

    for(
        const page
        of estado.paginas
    ){

        const acordes =
            [...page.asignadas.acordes]
            .sort(
                (a,b)=>
                    a.x-b.x
            );

        let tiempo =
            tiempoPagina;

        for(
            const acorde
            of acordes
        ){

            const duracion =
                estimarDuracion(
                    acorde,
                    page.asignadas.notas
                );

            clusters.push({

                tiempo,

                duracion,

                notas:
                    acorde.notas

            });

            tiempo +=
                duracion;

        }

        /*
         Separación pequeña
         entre páginas.
        */

        tiempoPagina =
            tiempo +
            TPQ;

    }


    /*
     Creamos eventos NOTE ON / OFF.
    */

    const eventos=[];

    for(
        const acorde
        of clusters
    ){

        for(
            const nota
            of acorde.notas
        ){

            eventos.push({

                tiempo:
                    acorde.tiempo,

                tipo:"on",

                pitch:
                    nota.pitch

            });

            eventos.push({

                tiempo:
                    acorde.tiempo+
                    acorde.duracion,

                tipo:"off",

                pitch:
                    nota.pitch

            });

        }

    }


    /*
     IMPORTANTE:
     los NOTE OFF se procesan antes
     que los NOTE ON en el mismo tick.
    */

    eventos.sort(
        (a,b)=>{

            if(
                a.tiempo !==
                b.tiempo
            ){

                return (
                    a.tiempo-
                    b.tiempo
                );

            }

            if(
                a.tipo ===
                b.tipo
            ){

                return 0;

            }

            return a.tipo === "off"
                ? -1
                : 1;

        }
    );


    const data=[];


    /*
     Tempo = 60 BPM.
    */

    data.push(
        0,
        0xff,
        0x51,
        3,
        0x0f,
        0x42,
        0x40
    );


    let ultimoTiempo=0;

    for(
        const evento
        of eventos
    ){

        const delta =
            evento.tiempo-
            ultimoTiempo;

        ultimoTiempo =
            evento.tiempo;


        if(
            evento.tipo ===
            "on"
        ){

            data.push(

                ...VLQ(
                    Math.max(
                        0,
                        delta
                    )
                ),

                0x90,

                evento.pitch,

                80

            );

        }else{

            data.push(

                ...VLQ(
                    Math.max(
                        0,
                        delta
                    )
                ),

                0x80,

                evento.pitch,

                0

            );

        }

    }


    /*
     Fin de pista.
    */

    data.push(

        0,
        0xff,
        0x2f,
        0

    );


    const track=[

        0x4d,
        0x54,
        0x72,
        0x6b,

        ...U32(
            data.length
        ),

        ...data

    ];


    /*
     MIDI Format 0
     1 pista
     480 ticks/negra
    */

    const header=[

        0x4d,
        0x54,
        0x68,
        0x64,

        0,
        0,
        0,
        6,

        0,
        0,

        0,
        1,

        1,
        0xE0

    ];


    const archivo =
        new Uint8Array(
            [
                ...header,
                ...track
            ]
        );


    return new Blob(
        [archivo],
        {
            type:
                "audio/midi"
        }
    );

}


/* ============================================================
   BOTONES
============================================================ */

document
    .getElementById(
        "analizar"
    )
    .onclick =
    analizar;


document
    .getElementById(
        "midi"
    )
    .onclick =
    ()=>{

        try{

            estado.midi =
                generarMIDI();

            document
                .getElementById(
                    "descargar"
                )
                .disabled=false;

            log(
                "🎹 MIDI GENERADO CORRECTAMENTE"
            );

            log(
                "✓ Las notas simultáneas se conservaron como acordes."
            );

            log(
                "✓ Las alturas se calcularon desde la posición vertical."
            );

            log(
                "✓ El tiempo se reconstruyó desde la geometría horizontal."
            );

            log(
                "⚠️ Esta versión todavía estima el ritmo."
            );

            log(
                "⚠️ Alteraciones, ligaduras y figuras complejas serán refinadas en la siguiente etapa."
            );

        }

        catch(error){

            log(
                "❌ ERROR GENERANDO MIDI: "+
                error.message
            );

        }

    };


document
    .getElementById(
        "descargar"
    )
    .onclick =
    ()=>{

        if(
            !estado.midi
        ){

            return;

        }

        const url =
            URL.createObjectURL(
                estado.midi
            );

        const enlace =
            document.createElement(
                "a"
            );

        enlace.href=url;

        enlace.download =
            "Experience_reconstruccion.mid";

        document.body.appendChild(
            enlace
        );

        enlace.click();

        enlace.remove();

        setTimeout(
            ()=>{
                URL.revokeObjectURL(
                    url
                );
            },
            1000
        );

    };

</script>
