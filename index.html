<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Experience — Generador MIDI</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #222;
  color: white;
  margin: 0;
  padding: 30px;
}

.container {
  max-width: 900px;
  margin: auto;
}

button {
  font-size: 18px;
  padding: 14px 22px;
  margin: 8px 0;
  cursor: pointer;
  border: 0;
  border-radius: 8px;
}

#generar {
  background: #4caf50;
  color: white;
}

#descargar {
  background: #2196f3;
  color: white;
  display: none;
}

#estado {
  background: #333;
  padding: 15px;
  margin-top: 20px;
  border-radius: 8px;
  white-space: pre-wrap;
}

.page {
  background: white;
  margin-top: 30px;
  padding: 20px;
  color: black;
}

svg {
  width: 100%;
  height: auto;
}
</style>
</head>

<body>

<div class="container">

<h1>Experience — Ludovico Einaudi</h1>

<p>
Este programa lee las cinco páginas SVG de la partitura
y construye un archivo MIDI.
</p>

<button id="generar">
🎹 GENERAR MIDI
</button>

<button id="descargar">
⬇️ DESCARGAR MIDI
</button>

<div id="estado">
Esperando...
</div>

<div id="partitura"></div>

</div>


<script>

/*
==========================================================
CONFIGURACIÓN
==========================================================
*/

const carpeta =
"EXPERIENCE%20-%20%20Ludovico%20Einaudi/";

const paginas = [
"score_0.svg",
"score_1.svg",
"score_2.svg",
"score_3.svg",
"score_4.svg"
];


/*
==========================================================
UTILIDADES MIDI
==========================================================
*/

function vlq(numero) {

    let buffer = numero & 0x7f;

    const bytes = [];

    while (
        (numero >>= 7)
    ) {

        buffer <<= 8;

        buffer |=
            ((numero & 0x7f) | 0x80);
    }

    while (true) {

        bytes.push(
            buffer & 0xff
        );

        if (
            buffer & 0x80
        ) {

            buffer >>= 8;

        } else {

            break;
        }
    }

    return bytes;
}


function textoMIDI(texto) {

    return [
        ...texto
            .split("")
            .map(
                c => c.charCodeAt(0)
            )
    ];
}


function numero16(n) {

    return [
        (n >> 8) & 255,
        n & 255
    ];
}


function numero32(n) {

    return [
        (n >> 24) & 255,
        (n >> 16) & 255,
        (n >> 8) & 255,
        n & 255
    ];
}


/*
==========================================================
CREAR MIDI
==========================================================
*/

function crearMIDI(notas) {

    const ticks =
        480;

    const eventos = [];

    /*
    Programa de piano.
    */

    eventos.push(
        0xC0,
        0
    );

    let tiempoAnterior = 0;

    for (const nota of notas) {

        const inicio =
            Math.round(
                nota.inicio *
                ticks
            );

        const duracion =
            Math.max(
                1,
                Math.round(
                    nota.duracion *
                    ticks
                )
            );

        const deltaInicio =
            inicio -
            tiempoAnterior;

        eventos.push(
            ...vlq(
                deltaInicio
            ),
            0x90,
            nota.midi,
            90
        );

        eventos.push(
            ...vlq(
                duracion
            ),
            0x80,
            nota.midi,
            0
        );

        tiempoAnterior =
            inicio + duracion;
    }

    /*
    Fin de pista.
    */

    eventos.push(
        0,
        0xff,
        0x2f,
        0
    );

    const encabezado = [
        ...textoMIDI("MThd"),
        ...numero32(6),
        ...numero16(0),
        ...numero16(1),
        ...numero16(ticks)
    ];

    const pista = [
        ...textoMIDI("MTrk"),
        ...numero32(eventos.length),
        ...eventos
    ];

    return new Uint8Array([
        ...encabezado,
        ...pista
    ]);
}


/*
==========================================================
CARGAR SVG
==========================================================
*/

async function cargarSVG() {

    const estado =
        document.getElementById(
            "estado"
        );

    const contenedor =
        document.getElementById(
            "partitura"
        );

    contenedor.innerHTML = "";

    const svgs = [];

    for (
        let i = 0;
        i < paginas.length;
        i++
    ) {

        estado.textContent =
            `Cargando página ${
                i + 1
            } de ${
                paginas.length
            }...`;

        const respuesta =
            await fetch(
                carpeta +
                paginas[i]
            );

        if (!respuesta.ok) {

            throw new Error(
                "No se pudo cargar " +
                paginas[i]
            );
        }

        const texto =
            await respuesta.text();

        svgs.push(texto);

        const pagina =
            document.createElement(
                "div"
            );

        pagina.className =
            "page";

        const parser =
            new DOMParser();

        const doc =
            parser.parseFromString(
                texto,
                "image/svg+xml"
            );

        const svg =
            doc.documentElement;

        pagina.appendChild(
            document.importNode(
                svg,
                true
            )
        );

        contenedor.appendChild(
            pagina
        );
    }

    return svgs;
}


/*
==========================================================
EXTRACCIÓN DE NOTAS
==========================================================
*/

/*
IMPORTANTE:

MuseScore puede generar SVG con diferentes
estructuras dependiendo de la versión.

Esta función busca información musical
que pueda estar embebida en atributos,
IDs o texto.

*/

function analizarSVG(svg) {

    const notas = [];

    const parser =
        new DOMParser();

    const doc =
        parser.parseFromString(
            svg,
            "image/svg+xml"
        );

    const elementos =
        [
            ...doc.querySelectorAll("*")
        ];

    for (const elemento of elementos) {

        const texto =
            (
                elemento.textContent ||
                ""
            ).trim();

        const id =
            elemento.id ||
            "";

        const clase =
            elemento.getAttribute(
                "class"
            ) || "";

        /*
        Buscamos nombres que MuseScore
        pueda utilizar para identificar
        notas.
        */

        const datos =
            (
                id + " " +
                clase + " " +
                texto
            ).toLowerCase();

        if (
            datos.includes("note") ||
            datos.includes("chord")
        ) {

            /*
            Si el SVG contiene atributos
            musicales, se podrían recuperar aquí.
            */

            const pitch =
                elemento.getAttribute(
                    "data-pitch"
                );

            const time =
                elemento.getAttribute(
                    "data-time"
                );

            const duration =
                elemento.getAttribute(
                    "data-duration"
                );

            if (
                pitch !== null &&
                time !== null
            ) {

                notas.push({
                    midi:
                        Number(pitch),

                    inicio:
                        Number(time),

                    duracion:
                        Number(
                            duration ||
                            1
                        )
                });
            }
        }
    }

    return notas;
}


/*
==========================================================
GENERAR
==========================================================
*/

let midiBlob = null;


document
.getElementById("generar")
.addEventListener(
"click",
async () => {

    const estado =
        document.getElementById(
            "estado"
        );

    try {

        estado.textContent =
            "Cargando las partituras...";

        const svgs =
            await cargarSVG();

        let notas = [];

        for (
            let i = 0;
            i < svgs.length;
            i++
        ) {

            estado.textContent =
                `Analizando página ${
                    i + 1
                }...`;

            const encontradas =
                analizarSVG(
                    svgs[i]
                );

            notas.push(
                ...encontradas
            );
        }

        /*
        Orden temporal.
        */

        notas.sort(
            (a,b) =>
                a.inicio -
                b.inicio
        );

        estado.textContent =
            `Análisis terminado.

Notas encontradas:
${notas.length}

`;

        if (!notas.length) {

            estado.textContent +=
                `No se encontraron atributos
musicales directamente en los SVG.

Esto significa que estos SVG contienen
la representación gráfica de la partitura,
pero no los datos MIDI semánticos.

En ese caso necesitamos hacer reconocimiento
visual de las notas o utilizar el archivo
musescore_pages.json / datos originales
de MuseScore.`;

            return;
        }

        const datos =
            crearMIDI(notas);

        midiBlob =
            new Blob(
                [datos],
                {
                    type:
                    "audio/midi"
                }
            );

        const boton =
            document.getElementById(
                "descargar"
            );

        boton.style.display =
            "inline-block";

        estado.textContent +=
            "MIDI generado correctamente.";

    }
    catch(error) {

        console.error(error);

        estado.textContent =
            "ERROR:\n\n" +
            error.message;
    }
});


/*
==========================================================
DESCARGAR
==========================================================
*/

document
.getElementById("descargar")
.addEventListener(
"click",
() => {

    if (!midiBlob)
        return;

    const url =
        URL.createObjectURL(
            midiBlob
        );

    const a =
        document.createElement(
            "a"
        );

    a.href = url;

    a.download =
        "Experience-Ludovico-Einaudi.mid";

    document.body.appendChild(a);

    a.click();

    a.remove();

    setTimeout(
        () =>
            URL.revokeObjectURL(url),
        1000
    );
});

</script>

</body>
</html>
