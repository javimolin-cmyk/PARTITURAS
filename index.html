<script>

/* ============================================================
   CONFIGURACIÓN
============================================================ */

const BASE =
"EXPERIENCE%20-%20%20Ludovico%20Einaudi/";

const ARCHIVOS=[
"score_0.svg",
"score_1.svg",
"score_2.svg",
"score_3.svg",
"score_4.svg"
];

const estado={
    paginas:[],
    midi:null
};


/* ============================================================
   LOG
============================================================ */

function log(t){

    const e=document.getElementById("log");

    e.textContent+=t+"\n";

    e.scrollTop=e.scrollHeight;
}

function limpiar(){

    document.getElementById("log").textContent="";

}


/* ============================================================
   PARSER GEOMÉTRICO SVG
============================================================ */

function parsePath(d){

    const tokens=
        d.match(
            /[a-zA-Z]|[-+]?(?:\d*\.\d+|\d+\.?)(?:e[-+]?\d+)?/ig
        )||[];

    let i=0;
    let cmd="";
    let x=0;
    let y=0;

    const xs=[];
    const ys=[];

    function n(){

        return parseFloat(tokens[i++])||0;

    }

    while(i<tokens.length){

        if(/[a-zA-Z]/.test(tokens[i])){
            cmd=tokens[i++];
        }

        const c=cmd.toLowerCase();

        if(c==="z"){
            cmd="";
            continue;
        }

        const rel=(cmd===c);

        if(c==="m"||c==="l"){

            const a=n();
            const b=n();

            if(rel){
                x+=a;
                y+=b;
            }else{
                x=a;
                y=b;
            }

            xs.push(x);
            ys.push(y);

            if(c==="m")
                cmd=rel?"l":"L";

        }

        else if(c==="h"){

            const a=n();

            x=rel?x+a:a;

            xs.push(x);
            ys.push(y);

        }

        else if(c==="v"){

            const a=n();

            y=rel?y+a:a;

            xs.push(x);
            ys.push(y);

        }

        else if(c==="c"){

            for(let k=0;k<3;k++){

                const a=n();
                const b=n();

                if(rel){
                    x+=a;
                    y+=b;
                }else{
                    x=a;
                    y=b;
                }

                xs.push(x);
                ys.push(y);
            }
        }

        else if(c==="s"||c==="q"){

            for(let k=0;k<2;k++){

                const a=n();
                const b=n();

                if(rel){
                    x+=a;
                    y+=b;
                }else{
                    x=a;
                    y=b;
                }

                xs.push(x);
                ys.push(y);
            }
        }

        else if(c==="t"){

            const a=n();
            const b=n();

            if(rel){
                x+=a;
                y+=b;
            }else{
                x=a;
                y=b;
            }

            xs.push(x);
            ys.push(y);

        }

        else if(c==="a"){

            n();
            n();
            n();
            n();
            n();

            const a=n();
            const b=n();

            if(rel){
                x+=a;
                y+=b;
            }else{
                x=a;
                y=b;
            }

            xs.push(x);
            ys.push(y);

        }

        else{

            i++;

        }
    }

    if(!xs.length)
        return null;

    return {
        x:Math.min(...xs),
        y:Math.min(...ys),
        x2:Math.max(...xs),
        y2:Math.max(...ys),
        width:Math.max(...xs)-Math.min(...xs),
        height:Math.max(...ys)-Math.min(...ys)
    };
}


/* ============================================================
   SUBPATHS
============================================================ */

function subpaths(path){

    const d=
        path.getAttribute("d")||"";

    const starts=
        [...d.matchAll(/[Mm]/g)]
        .map(x=>x.index);

    const result=[];

    for(let i=0;i<starts.length;i++){

        const start=starts[i];

        const end=
            i+1<starts.length
            ?starts[i+1]
            :d.length;

        const part=
            d.substring(start,end);

        const b=parsePath(part);

        if(b)
            result.push(b);
    }

    return result;
}


/* ============================================================
   CABEZAS
============================================================ */

function detectarCabezas(svg){

    const result=[];

    svg.querySelectorAll(".Note")
    .forEach((note,noteIndex)=>{

        subpaths(note)
        .forEach((b,subIndex)=>{

            /*
             Las cabezas son pequeños óvalos.
             Ignoramos geometrías enormes.
            */

            if(
                b.width>=8 &&
                b.width<=90 &&
                b.height>=8 &&
                b.height<=90
            ){

                result.push({

                    x:b.x+b.width/2,
                    y:b.y+b.height/2,

                    width:b.width,
                    height:b.height,

                    noteIndex,
                    subIndex

                });
            }

        });
    });

    return result;
}


/* ============================================================
   ELEMENTOS MUSICALES
============================================================ */

function detectarElementos(svg){

    const clases=[
        "Stem",
        "Beam",
        "BarLine",
        "Rest",
        "KeySig",
        "TimeSig",
        "TieSegment",
        "OttavaSegment",
        "VoltaSegment",
        "Dynamic",
        "Fermata",
        "HairpinSegment",
        "GradualTempoChangeSegment",
        "Tempo",
        "Expression"
    ];

    const salida={};

    for(const clase of clases){

        salida[clase]=[];

        svg.querySelectorAll(
            "."+clase
        )
        .forEach(el=>{

            const b=
                parsePath(
                    el.getAttribute("d")||""
                );

            salida[clase].push({

                element:el,
                bounds:b

            });

        });
    }

    return salida;
}


/* ============================================================
   STAFFLINES
============================================================ */

function detectarLineas(svg){

    const lineas=[];

    svg.querySelectorAll(".StaffLines")
    .forEach(el=>{

        subpaths(el)
        .forEach(b=>{

            if(b.width>100){

                lineas.push(b);

            }
        });
    });

    return lineas.sort(
        (a,b)=>a.y-b.y
    );
}


/* ============================================================
   AGRUPAR LÍNEAS EN PENTAGRAMAS
============================================================ */

function agruparPentagramas(lineas){

    const grupos=[];

    for(const linea of lineas){

        let grupo=null;

        for(const g of grupos){

            if(
                Math.abs(
                    g.centro-linea.y
                )<80
            ){

                grupo=g;
                break;
            }
        }

        if(!grupo){

            grupo={
                lineas:[],
                arriba:linea.y,
                abajo:linea.y,
                centro:linea.y
            };

            grupos.push(grupo);
        }

        grupo.lineas.push(linea);

        grupo.arriba=
            Math.min(
                grupo.arriba,
                linea.y
            );

        grupo.abajo=
            Math.max(
                grupo.abajo,
                linea.y
            );

        grupo.centro=
            (grupo.arriba+
             grupo.abajo)/2;
    }

    return grupos
        .sort(
            (a,b)=>a.centro-b.centro
        );
}


/* ============================================================
   STAFF MÁS CERCANO
============================================================ */

function staffCercano(y,pentagramas){

    let mejor=null;
    let distancia=Infinity;

    for(
        let i=0;
        i<pentagramas.length;
        i++
    ){

        const s=pentagramas[i];

        let d;

        if(y<s.arriba)
            d=s.arriba-y;
        else if(y>s.abajo)
            d=y-s.abajo;
        else
            d=0;

        if(d<distancia){

            distancia=d;

            mejor={
                ...s,
                index:i,
                distancia:d
            };
        }
    }

    return mejor;
}


/* ============================================================
   PITCH DIATÓNICO
============================================================ */

function pitchDesdeStaff(y,staff){

    /*
     Distancia entre líneas.
    */

    const espacio=
        Math.max(
            1,
            (staff.abajo-staff.arriba)/4
        );

    /*
     Cada línea/espacio representa
     un grado diatónico.
    */

    const grados=
        Math.round(
            (staff.centro-y)/
            (espacio/2)
        );

    /*
     Alternancia inicial:
     pentagrama superior = clave Sol
     pentagrama inferior = clave Fa.

     Esto es una aproximación inicial.
     La próxima etapa leerá Clef.
    */

    const esFa=
        staff.index%2===1;

    const base=
        esFa?50:71;

    /*
     Tabla cromática aproximada
     para convertir grados diatónicos.
    */

    const semitonos=[
        0,2,4,5,7,9,11
    ];

    let octava=Math.floor(grados/7);

    let grado=
        ((grados%7)+7)%7;

    let midi=
        base+
        octava*12+
        semitonos[grado];

    return Math.max(
        21,
        Math.min(
            108,
            midi
        )
    );
}


/* ============================================================
   ASIGNAR CABEZAS
============================================================ */

function asignarCabezas(page){

    const notas=[];

    for(const cabeza of page.cabezas){

        const staff=
            staffCercano(
                cabeza.y,
                page.pentagramas
            );

        if(!staff)
            continue;

        const pitch=
            pitchDesdeStaff(
                cabeza.y,
                staff
            );

        notas.push({

            ...cabeza,

            staff:
                staff.index,

            pitch,

            distanciaStaff:
                staff.distancia

        });
    }

    notas.sort(
        (a,b)=>
            a.staff-b.staff||
            a.x-b.x||
            a.y-b.y
    );

    return notas;
}


/* ============================================================
   DETECTAR ACORDES
============================================================ */

function detectarAcordes(notas){

    const acordes=[];

    for(const nota of notas){

        let acorde=
            acordes.find(
                a=>
                    a.staff===nota.staff &&
                    Math.abs(
                        a.x-nota.x
                    )<15
            );

        if(!acorde){

            acorde={
                staff:nota.staff,
                x:nota.x,
                notas:[]
            };

            acordes.push(acorde);
        }

        acorde.notas.push(nota);
    }

    return acordes;
}


/* ============================================================
   COMPASES
============================================================ */

function detectarCompasDeNota(
    nota,
    barras
){

    let anterior=null;
    let siguiente=null;

    for(const x of barras){

        if(x<=nota.x)
            anterior=x;

        if(x>nota.x){

            siguiente=x;
            break;
        }
    }

    /*
     Número de compás:
     depende de la barra anterior.
     Se conserva la posición para
     reconstrucción posterior.
    */

    return {

        anterior,
        siguiente,

        posicion:
            siguiente!==null
            ?nota.x-anterior
            :nota.x-(anterior||0)

    };
}


/* ============================================================
   ANALIZAR FIGURAS RÍTMICAS
============================================================ */

function analizarRitmo(nota,page){

    /*
     Buscamos Stem y Beam cerca
     de la cabeza.

     Esto NO adivina todavía una figura
     solamente por distancia horizontal.
    */

    let stem=null;
    let beam=null;

    for(const s of page.elementos.Stem){

        if(!s.bounds)
            continue;

        const b=s.bounds;

        const centroX=
            b.x+b.width/2;

        if(
            Math.abs(
                centroX-nota.x
            )<80 &&
            (
                b.y<=nota.y+100 &&
                b.y2>=nota.y-100
            )
        ){

            stem=s;
            break;
        }
    }

    for(const b of page.elementos.Beam){

        if(!b.bounds)
            continue;

        const box=b.bounds;

        if(
            nota.x>=box.x-30 &&
            nota.x<=box.x2+30 &&
            nota.y>=box.y-150 &&
            nota.y<=box.y2+150
        ){

            beam=b;
            break;
        }
    }

    /*
     Estado preliminar.
    */

    let figura="desconocida";

    if(beam){

        figura="beam";

    }else if(stem){

        figura="stem";

    }

    return {

        figura,

        tieneStem:!!stem,

        tieneBeam:!!beam

    };
}


/* ============================================================
   RITMO ESTRUCTURAL
============================================================ */

function construirEventos(page){

    const acordes=
        detectarAcordes(
            page.notas
        );

    const eventos=[];

    for(const acorde of acordes){

        const notas=
            acorde.notas;

        const primera=notas[0];

        const compas=
            detectarCompasDeNota(
                primera,
                page.barras
            );

        const ritmos=
            notas.map(
                n=>
                    analizarRitmo(
                        n,
                        page
                    )
            );

        eventos.push({

            x:acorde.x,

            staff:acorde.staff,

            compas,

            notas,

            ritmos

        });
    }

    return eventos;
}


/* ============================================================
   RESUMEN DE ELEMENTOS
============================================================ */

function resumenElementos(elementos){

    const lista=[];

    for(
        const [nombre,items]
        of Object.entries(elementos)
    ){

        if(items.length){

            lista.push(
                nombre+
                ": "+
                items.length
            );
        }
    }

    return lista.join(" · ");
}


/* ============================================================
   MOSTRAR RESULTADOS
============================================================ */

function mostrarPagina(page,index){

    const div=
        document.createElement("div");

    div.className="page";

    const cantidadAlta=
        page.notas.filter(
            n=>
                n.distanciaStaff<20
        ).length;

    div.innerHTML=`

<h3>📄 Página ${index+1}</h3>

<p>
<b>Cabezas:</b> ${page.cabezas.length}
· <b>Líneas:</b> ${page.lineas.length}
· <b>Pentagramas:</b> ${page.pentagramas.length}
· <b>Barras:</b> ${page.barras.length}
· <b>Asignadas:</b> ${page.notas.length}
</p>

<p>
<b>Elementos musicales:</b><br>
${resumenElementos(page.elementos)}
</p>

<p>
🟢 Alta confianza de pentagrama:
${cantidadAlta}/${page.notas.length}
</p>

<h4>Primeros eventos musicales</h4>

<table>

<tr>
<th>#</th>
<th>X</th>
<th>Staff</th>
<th>Pitch</th>
<th>Compás</th>
<th>Ritmo</th>
<th>Notas simultáneas</th>
</tr>

${page.eventos
.slice(0,50)
.map(
(e,i)=>`

<tr>

<td>${i+1}</td>

<td>${e.x.toFixed(1)}</td>

<td>${e.staff+1}</td>

<td>
${e.notas
.map(n=>n.pitch)
.join(", ")}
</td>

<td>
${
e.compas.anterior===null
?"inicio"
:"posición "+e.compas.posicion.toFixed(1)
}
</td>

<td>
${e.ritmos
.map(r=>r.figura)
.join(", ")}
</td>

<td>
${e.notas.length}
</td>

</tr>
`
)
.join("")}

</table>
`;

    document
        .getElementById("resultados")
        .appendChild(div);
}


/* ============================================================
   ANÁLISIS PRINCIPAL
============================================================ */

async function analizar(){

    limpiar();

    document
        .getElementById("resultados")
        .innerHTML="";

    document
        .getElementById("midi")
        .disabled=true;

    document
        .getElementById("descargar")
        .disabled=true;

    estado.paginas=[];

    let totalCabezas=0;
    let totalAsignadas=0;
    let totalPentagramas=0;

    log(
        "▶ INICIANDO ANÁLISIS MUSICAL PROFUNDO"
    );

    for(
        let i=0;
        i<ARCHIVOS.length;
        i++
    ){

        log(
            "📄 Página "+
            (i+1)+
            " / "+
            ARCHIVOS.length
        );

        try{

            const respuesta=
                await fetch(
                    BASE+ARCHIVOS[i],
                    {
                        cache:"no-store"
                    }
                );

            if(!respuesta.ok)
                throw new Error(
                    "HTTP "+
                    respuesta.status
                );

            const texto=
                await respuesta.text();

            const doc=
                new DOMParser()
                .parseFromString(
                    texto,
                    "image/svg+xml"
                );

            const svg=
                doc.documentElement;

            const page={

                svg,

                texto,

                cabezas:
                    detectarCabezas(svg),

                lineas:
                    detectarLineas(svg),

                pentagramas:[],

                barras:[],

                elementos:{},

                notas:[],

                eventos:[]

            };

            page.pentagramas=
                agruparPentagramas(
                    page.lineas
                );

            page.barras=
                [...new Set(
                    page.elementos.Bars||[]
                )];

            page.elementos=
                detectarElementos(svg);

            /*
             Barras reales.
            */

            page.barras=
                page.elementos.BarLine
                .filter(
                    x=>x.bounds
                )
                .map(
                    x=>x.bounds.x
                )
                .sort(
                    (a,b)=>a-b
                );

            page.notas=
                asignarCabezas(page);

            page.eventos=
                construirEventos(page);

            estado.paginas.push(page);

            totalCabezas+=
                page.cabezas.length;

            totalAsignadas+=
                page.notas.length;

            totalPentagramas+=
                page.pentagramas.length;

            log(
                "   ✓ SVG cargado — "+
                texto.length+
                " caracteres"
            );

            log(
                "   .Note: "+
                svg.querySelectorAll(".Note").length
            );

            log(
                "   🔴 Cabezas: "+
                page.cabezas.length
            );

            log(
                "   📏 Líneas: "+
                page.lineas.length
            );

            log(
                "   🎼 Pentagramas: "+
                page.pentagramas.length
            );

            log(
                "   ├ BarLine: "+
                page.elementos.BarLine.length
            );

            log(
                "   ├ Stem: "+
                page.elementos.Stem.length
            );

            log(
                "   ├ Beam: "+
                page.elementos.Beam.length
            );

            log(
                "   ├ Rest: "+
                page.elementos.Rest.length
            );

            log(
                "   ├ KeySig: "+
                page.elementos.KeySig.length
            );

            log(
                "   ├ TimeSig: "+
                page.elementos.TimeSig.length
            );

            log(
                "   ├ TieSegment: "+
                page.elementos.TieSegment.length
            );

            log(
                "   ├ OttavaSegment: "+
                page.elementos.OttavaSegment.length
            );

            log(
                "   ✓ Asignadas: "+
                page.notas.length
            );

            log(
                "   🎵 Eventos/acordes: "+
                page.eventos.length
            );

            mostrarPagina(
                page,
                i
            );

        }
        catch(error){

            log(
                "❌ ERROR: "+
                error.message
            );
        }
    }

    document
        .getElementById("stats")
        .innerHTML=`

<div class="stat">
<b>${estado.paginas.length}</b><br>Páginas
</div>

<div class="stat">
<b>${totalCabezas}</b><br>Cabezas
</div>

<div class="stat">
<b>${totalPentagramas}</b><br>Pentagramas
</div>

<div class="stat">
<b>${totalAsignadas}</b><br>Asignadas
</div>
`;

    log(
        "================================"
    );

    log(
        "✓ ANÁLISIS MUSICAL COMPLETADO"
    );

    log(
        "Total cabezas: "+
        totalCabezas
    );

    log(
        "Total pentagramas: "+
        totalPentagramas
    );

    log(
        "Total asignadas: "+
        totalAsignadas
    );

    log(
        "================================"
    );

    if(totalAsignadas){

        document
            .getElementById("midi")
            .disabled=false;
    }
}


/* ============================================================
   MIDI
============================================================ */

function vlq(value){

    let buffer=value&127;

    const bytes=[];

    while(value>>=7){

        buffer<<=8;

        buffer|=
            (value&127)|128;
    }

    while(true){

        bytes.push(
            buffer&255
        );

        if(buffer&128){

            buffer>>=8;

        }else{

            break;
        }
    }

    return bytes;
}

function u32(n){

    return [

        (n>>24)&255,
        (n>>16)&255,
        (n>>8)&255,
        n&255

    ];
}


/* ============================================================
   GENERAR MIDI
============================================================ */

function generarMIDI(){

    const TPQ=480;

    const eventos=[];

    /*
     IMPORTANTE:
     todavía no inventamos las duraciones.
     Esta versión usa la estructura espacial
     como orden temporal, pero conserva
     los grupos de acordes.
    */

    let tiempoGlobal=0;

    for(const page of estado.paginas){

        const eventosPagina=
            [...page.eventos]
            .sort(
                (a,b)=>a.x-b.x
            );

        let anteriorX=null;

        for(const evento of eventosPagina){

            if(anteriorX===null){

                anteriorX=evento.x;

            }else{

                const dx=
                    evento.x-anteriorX;

                /*
                 Conversión provisional.
                 */

                if(dx<40)
                    tiempoGlobal+=120;

                else if(dx<80)
                    tiempoGlobal+=240;

                else if(dx<150)
                    tiempoGlobal+=480;

                else
                    tiempoGlobal+=960;

                anteriorX=
                    evento.x;
            }

            /*
             Acorde:
             todas las notas del mismo evento
             comienzan simultáneamente.
            */

            for(const nota of evento.notas){

                eventos.push({

                    tiempo:tiempoGlobal,

                    tipo:1,

                    pitch:nota.pitch,

                    velocity:85

                });

                eventos.push({

                    tiempo:
                        tiempoGlobal+480,

                    tipo:0,

                    pitch:nota.pitch,

                    velocity:0

                });
            }
        }

        tiempoGlobal+=480;
    }


    eventos.sort(
        (a,b)=>
            a.tiempo-b.tiempo||
            a.tipo-b.tipo
    );


    const track=[];

    /*
     120 BPM
    */

    track.push(
        0,
        0xff,
        0x51,
        3,
        0x07,
        0xa1,
        0x20
    );


    let ultimo=0;

    for(const e of eventos){

        const delta=
            e.tiempo-ultimo;

        ultimo=e.tiempo;

        track.push(
            ...vlq(
                Math.max(
                    0,
                    delta
                )
            )
        );

        track.push(
            e.tipo
            ?0x90
            :0x80
        );

        track.push(
            e.pitch,
            e.velocity
        );
    }

    track.push(
        0,
        0xff,
        0x2f,
        0
    );


    const header=[

        0x4d,0x54,0x68,0x64,

        0,0,0,6,

        0,0,

        0,1,

        1,0xe0

    ];


    const chunk=[

        0x4d,0x54,0x72,0x6b,

        ...u32(track.length),

        ...track
    ];


    return new Blob(
        [
            new Uint8Array([
                ...header,
                ...chunk
            ])
        ],
        {
            type:"audio/midi"
        }
    );
}
