<script>

"use strict";


/* ============================================================
   CONFIGURACIÓN
============================================================ */

const BASE =
"EXPERIENCE%20-%20%20Ludovico%20Einaudi/";

const ARCHIVOS = [
    "score_0.svg",
    "score_1.svg",
    "score_2.svg",
    "score_3.svg",
    "score_4.svg"
];


/*
    EXPERIENCE está escrita para piano.

    Cada sistema normalmente contiene:

        pentagrama superior = clave de sol
        pentagrama inferior = clave de fa

    Por eso los pentagramas se agrupan de dos en dos.
*/

const PULSOS_POR_NEGRA = 480;

const BPM_DEFAULT = 60;


/* ============================================================
   ESTADO
============================================================ */

let paginas = [];

let todasLasNotas = [];

let contadorGlobal = 0;

let svgTemporal = null;


/* ============================================================
   LOG
============================================================ */

function log(texto){

    const estado =
        document.getElementById(
            "estado"
        );

    estado.textContent +=
        texto + "\n";

    estado.scrollTop =
        estado.scrollHeight;
}


function resetLog(){

    document.getElementById(
        "estado"
    ).textContent = "";
}


/* ============================================================
   SEPARAR SUBPATHS
============================================================ */

function separarSubpaths(d){

    if(!d)
        return [];

    const posiciones = [];

    const regex =
        /[Mm](?=[-+.\d])/g;

    let match;

    while(
        (match=regex.exec(d))
        !== null
    ){

        posiciones.push(
            match.index
        );
    }

    const resultado=[];

    for(
        let i=0;
        i<posiciones.length;
        i++
    ){

        const inicio =
            posiciones[i];

        const fin =
            i+1<posiciones.length
            ? posiciones[i+1]
            : d.length;

        const parte =
            d.slice(
                inicio,
                fin
            ).trim();

        if(parte)
            resultado.push(parte);
    }

    return resultado;
}


/* ============================================================
   SVG TEMPORAL
============================================================ */

function getSVGTemporal(){

    if(svgTemporal)
        return svgTemporal;

    svgTemporal =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "svg"
        );

    svgTemporal.setAttribute(
        "width",
        "10000"
    );

    svgTemporal.setAttribute(
        "height",
        "10000"
    );

    svgTemporal.style.position =
        "absolute";

    svgTemporal.style.left =
        "-100000px";

    svgTemporal.style.top =
        "0";

    svgTemporal.style.visibility =
        "hidden";

    document.body.appendChild(
        svgTemporal
    );

    return svgTemporal;
}


/* ============================================================
   BBOX
============================================================ */

function bboxPath(d){

    try{

        const svg =
            getSVGTemporal();

        const path =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "path"
            );

        path.setAttribute(
            "d",
            d
        );

        svg.appendChild(path);

        const b =
            path.getBBox();

        path.remove();

        return {

            x:b.x,
            y:b.y,

            width:b.width,
            height:b.height,

            cx:
                b.x+b.width/2,

            cy:
                b.y+b.height/2
        };

    }catch(e){

        return null;
    }
}


/* ============================================================
   CABEZAS
============================================================ */

function detectarCabezas(
    svg,
    pagina
){

    const elements =
        [
            ...svg.querySelectorAll(
                ".Note"
            )
        ];

    const notas=[];


    for(
        const element
        of elements
    ){

        const d =
            element.getAttribute(
                "d"
            );

        if(!d)
            continue;


        const subpaths =
            separarSubpaths(d);


        for(
            const subpath
            of subpaths
        ){

            if(
                !/[Cc]/.test(
                    subpath
                )
            )
                continue;


            const b =
                bboxPath(
                    subpath
                );

            if(!b)
                continue;


            if(
                b.width<5 ||
                b.height<5
            )
                continue;


            if(
                b.width>100 ||
                b.height>100
            )
                continue;


            const ratio =
                b.width/b.height;


            if(
                ratio<.35 ||
                ratio>4
            )
                continue;


            notas.push({

                id:
                    ++contadorGlobal,

                pagina,

                x:b.cx,
                y:b.cy,

                width:b.width,
                height:b.height,

                d:subpath,

                pentagrama:null,

                indicePentagrama:null,

                lineaVirtual:null,

                pasoDiatonico:null,

                pitch:null,

                nombre:null,

                octava:null,

                midi:null,

                confidence:0,

                tiempo:0,

                duracion:0
            });
        }
    }

    return notas;
}


/* ============================================================
   STAFFLINES
============================================================ */

function extraerLineasStaff(svg){

    const staff =
        svg.querySelector(
            ".StaffLines"
        );

    if(!staff)
        return [];


    try{

        const longitud =
            staff.getTotalLength();

        if(!longitud)
            return [];


        const puntos=[];


        const muestras =
            Math.max(
                1000,
                Math.ceil(
                    longitud/4
                )
            );


        for(
            let i=0;
            i<=muestras;
            i++
        ){

            const distancia =
                longitud*i/muestras;

            const p =
                staff.getPointAtLength(
                    distancia
                );

            puntos.push({
                x:p.x,
                y:p.y
            });
        }


        const grupos=[];


        for(
            const punto
            of puntos
        ){

            let grupo=null;


            for(
                const g
                of grupos
            ){

                if(
                    Math.abs(
                        g.y-punto.y
                    )<1.5
                ){

                    grupo=g;
                    break;
                }
            }


            if(!grupo){

                grupo={
                    y:punto.y,
                    puntos:[]
                };

                grupos.push(
                    grupo
                );
            }


            grupo.puntos.push(
                punto
            );
        }


        const lineas=[];


        for(
            const grupo
            of grupos
        ){

            if(
                grupo.puntos.length<3
            )
                continue;


            const xs =
                grupo.puntos.map(
                    p=>p.x
                );


            const x1 =
                Math.min(...xs);

            const x2 =
                Math.max(...xs);


            const width =
                x2-x1;


            if(width<300)
                continue;


            lineas.push({

                y:grupo.y,

                x1,
                x2,

                width
            });
        }


        lineas.sort(
            (a,b)=>
                a.y-b.y
        );


        const finales=[];


        for(
            const linea
            of lineas
        ){

            const anterior =
                finales[
                    finales.length-1
                ];


            if(
                anterior &&
                Math.abs(
                    anterior.y-linea.y
                )<3
            ){

                anterior.x1 =
                    Math.min(
                        anterior.x1,
                        linea.x1
                    );

                anterior.x2 =
                    Math.max(
                        anterior.x2,
                        linea.x2
                    );

                anterior.width =
                    anterior.x2-
                    anterior.x1;

                anterior.y =
                    (
                        anterior.y+
                        linea.y
                    )/2;

            }else{

                finales.push({
                    ...linea
                });
            }
        }


        return finales;

    }catch(e){

        console.error(e);

        return [];
    }
}


/* ============================================================
   AGRUPAR PENTAGRAMAS
============================================================ */

function crearPentagrama(
    lineas
){

    const ordenadas =
        [...lineas].sort(
            (a,b)=>a.y-b.y
        );


    const ys =
        ordenadas.map(
            x=>x.y
        );


    const espacio =
        (
            ys[4]-ys[0]
        )/4;


    return {

        lineas:
            ordenadas.map(
                (l,i)=>({

                    ...l,

                    indice:i+1
                })
            ),

        top:ys[0],

        bottom:ys[4],

        center:
            (ys[0]+ys[4])/2,

        espacio,

        x1:
            Math.min(
                ...ordenadas.map(
                    x=>x.x1
                )
            ),

        x2:
            Math.max(
                ...ordenadas.map(
                    x=>x.x2
                )
            )
    };
}


function agruparPentagramas(
    lineas
){

    if(
        lineas.length<5
    )
        return [];


    const ordenadas =
        [...lineas].sort(
            (a,b)=>a.y-b.y
        );


    const grupos=[];


    /*
       Las StaffLines ya fueron
       identificadas individualmente.

       Ahora agrupamos cinco líneas
       consecutivas.

       Esto es más fiable para esta
       partitura que intentar inferir
       sistemas únicamente mediante
       la distancia vertical.
    */

    for(
        let i=0;
        i+4<ordenadas.length;
    ){

        const grupo =
            ordenadas.slice(
                i,
                i+5
            );


        const gaps=[];

        for(
            let j=1;
            j<grupo.length;
            j++
        ){

            gaps.push(
                grupo[j].y-
                grupo[j-1].y
            );
        }


        const medio =
            gaps.reduce(
                (a,b)=>a+b,
                0
            )/gaps.length;


        const maxGap =
            Math.max(...gaps);


        /*
           Si las cinco líneas están
           razonablemente próximas,
           aceptamos el pentagrama.
        */

        if(
            maxGap <
            medio*1.8
        ){

            grupos.push(
                crearPentagrama(
                    grupo
                )
            );

            i+=5;

        }else{

            /*
               En caso de anomalía,
               avanzamos una línea y
               buscamos el siguiente bloque.
            */

            i++;
        }
    }


    return grupos;
}


/* ============================================================
   ASIGNAR PENTAGRAMA
============================================================ */

function asignarPentagramas(
    notas,
    pentagramas
){

    for(
        const nota
        of notas
    ){

        let mejor=null;

        let mejorDist=
            Infinity;


        for(
            let i=0;
            i<pentagramas.length;
            i++
        ){

            const p =
                pentagramas[i];


            /*
              El X también debe caer
              dentro del sistema.
            */

            if(
                nota.x<
                p.x1-100 ||
                nota.x>
                p.x2+100
            )
                continue;


            let distancia=0;


            if(
                nota.y<
                p.top
            ){

                distancia =
                    p.top-nota.y;

            }else if(
                nota.y>
                p.bottom
            ){

                distancia =
                    nota.y-p.bottom;
            }


            /*
               Permitimos ledger lines
               bastante alejadas.
            */

            const limite =
                p.espacio*7;


            if(
                distancia>limite
            )
                continue;


            if(
                distancia<
                mejorDist
            ){

                mejorDist=distancia;

                mejor={
                    indice:i,
                    distancia
                };
            }
        }


        if(mejor){

            nota.pentagrama =
                mejor.indice+1;

            nota.indicePentagrama =
                mejor.indice;

        }else{

            nota.pentagrama =
                null;

            nota.indicePentagrama =
                null;
        }
    }


    return notas;
}


/* ============================================================
   PITCH
============================================================ */


/*
    Líneas de clave de SOL:

        línea 1 = E4
        línea 2 = G4
        línea 3 = B4
        línea 4 = D5
        línea 5 = F5

    Líneas de clave de FA:

        línea 1 = G2
        línea 2 = B2
        línea 3 = D3
        línea 4 = F3
        línea 5 = A3

    Una nota situada en un espacio se encuentra
    medio paso diatónico entre dos líneas.
*/


const escalaDiatonica = [
    "C",
    "D",
    "E",
    "F",
    "G",
    "A",
    "B"
];


function diatonicIndex(
    nombre,
    octava
){

    const base = {
        C:0,
        D:1,
        E:2,
        F:3,
        G:4,
        A:5,
        B:6
    };

    return (
        octava*7+
        base[nombre]
    );
}


function desdeDiatonico(
    indice
){

    let octava =
        Math.floor(
            indice/7
        );

    let grado =
        indice%7;


    if(grado<0){

        grado+=7;

        octava--;
    }


    return {

        nombre:
            escalaDiatonica[
                grado
            ],

        octava
    };
}


/*
    Calcula la posición vertical
    en unidades de línea.

    Línea superior = 0
    línea inferior = 4

    Espacio superior = -0.5
    etc.
*/

function calcularPasoVertical(
    nota,
    pentagrama
){

    const espacio =
        pentagrama.espacio;


    if(
        !espacio ||
        espacio<=0
    )
        return null;


    /*
       La línea inferior es índice 4.

       Una distancia de una línea =
       1 paso diatónico.

       Por eso:
       
       paso =
       4 - (y-bottom)/espacio
    */

    const paso =
        4 -
        (
            nota.y-
            pentagrama.bottom
        )/
        espacio;


    return paso;
}


function calcularPitch(
    nota,
    pentagrama,
    indicePentagrama
){

    const paso =
        calcularPasoVertical(
            nota,
            pentagrama
        );


    if(paso===null)
        return null;


    /*
       En esta primera versión usamos
       la estructura habitual de piano:

          pentagrama par =
          clave de sol

          pentagrama impar siguiente =
          clave de fa
    */

    const esSuperior =
        indicePentagrama%2===0;


    let lineaBase;
    let octavaBase;


    if(esSuperior){

        /*
           línea inferior = E4
        */

        lineaBase=2;
        octavaBase=4;

    }else{

        /*
           línea inferior = G2
        */

        lineaBase=4;
        octavaBase=2;
    }


    const pasoRedondeado =
        Math.round(paso);


    const indiceBase =
        diatonicIndex(
            escalaDiatonica[
                lineaBase
            ],
            octavaBase
        );


    const indice =
        indiceBase+
        pasoRedondeado;


    const resultado =
        desdeDiatonico(
            indice
        );


    /*
       MIDI natural.

       C-1 = 0
       C4 = 60
    */

    const midiNaturaleza = {

        C:0,
        D:2,
        E:4,
        F:5,
        G:7,
        A:9,
        B:11
    };


    const midi =
        (
            resultado.octava+1
        )*12+
        midiNaturaleza[
            resultado.nombre
        ];


    /*
       Error de cuantización vertical.

       Si la nota cae exactamente sobre
       línea/espacio, será pequeño.

       Si está demasiado lejos,
       marcamos baja confianza.
    */

    const error =
        Math.abs(
            paso-
            pasoRedondeado
        );


    let confidence =
        1-
        Math.min(
            error*2,
            1
        );


    /*
       Si está dentro de una distancia
       razonable, aceptamos.
    */

    return {

        nombre:
            resultado.nombre,

        octava:
            resultado.octava,

        midi,

        pasoDiatonico:
            pasoRedondeado,

        errorVertical:
            error,

        confidence,

        clave:
            esSuperior
            ? "SOL"
            : "FA"
    };
}


function asignarPitches(
    notas,
    pentagramas
){

    for(
        const nota
        of notas
    ){

        if(
            nota.indicePentagrama===null
        )
            continue;


        const p =
            pentagramas[
                nota.indicePentagrama
            ];


        const resultado =
            calcularPitch(
                nota,
                p,
                nota.indicePentagrama
            );


        if(!resultado)
            continue;


        nota.lineaVirtual =
            resultado.pasoDiatonico;

        nota.pasoDiatonico =
            resultado.pasoDiatonico;

        nota.pitch =
            resultado.nombre+
            resultado.octava;

        nota.nombre =
            resultado.nombre;

        nota.octava =
            resultado.octava;

        nota.midi =
            resultado.midi;

        nota.confidence =
            resultado.confidence;

        nota.clave =
            resultado.clave;
    }


    return notas;
}


/* ============================================================
   ORDEN TEMPORAL
============================================================ */

function ordenarNotas(
    paginas
){

    for(
        const pagina
        of paginas
    ){

        pagina.notas.sort(
            (a,b)=>{

                /*
                  Primero por sistema,
                  después por X.
                */

                const pa =
                    a.indicePentagrama ??
                    99999;

                const pb =
                    b.indicePentagrama ??
                    99999;


                if(pa!==pb)
                    return pa-pb;


                return a.x-b.x;
            }
        );
    }
}


/* ============================================================
   AGRUPAR NOTAS POR POSICIÓN X
   PARA DETECTAR ACORDES
============================================================ */

function detectarAcordes(
    notas
){

    const grupos=[];


    const ordenadas =
        [...notas].sort(
            (a,b)=>
                a.x-b.x
        );


    for(
        const nota
        of ordenadas
    ){

        let grupo=null;


        for(
            const g
            of grupos
        ){

            if(
                Math.abs(
                    g.x-
                    nota.x
                )<12
            ){

                grupo=g;
                break;
            }
        }


        if(!grupo){

            grupo={
                x:nota.x,
                notas:[]
            };

            grupos.push(
                grupo
            );

        }else{

            grupo.notas.push(
                nota
            );
        }
    }


    for(
        const grupo
        of grupos
    ){

        if(
            grupo.notas.length>1
        ){

            const id =
                grupo.notas
                    .map(
                        n=>n.id
                    )
                    .join("-");


            for(
                const nota
                of grupo.notas
            ){

                nota.acorde=id;
            }
        }
    }
}


/* ============================================================
   CARGAR SVG
============================================================ */

async function cargarSVG(url){

    const response =
        await fetch(
            url,
            {
                cache:"no-store"
            }
        );


    if(!response.ok){

        throw new Error(
            `HTTP ${response.status}`
        );
    }


    const texto =
        await response.text();


    const parser =
        new DOMParser();


    const doc =
        parser.parseFromString(
            texto,
            "image/svg+xml"
        );


    const svg =
        doc.documentElement;


    if(
        !svg ||
        svg.nodeName.toLowerCase()
        !=="svg"
    ){

        throw new Error(
            "SVG inválido"
        );
    }


    return {

        svg,

        texto
    };
}


/* ============================================================
   MOSTRAR SVG
============================================================ */

function mostrarSVG(
    svg,
    contenedor
){

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "svg-wrapper";


    const copia =
        document.importNode(
            svg,
            true
        );


    copia.removeAttribute(
        "width"
    );

    copia.removeAttribute(
        "height"
    );


    copia.style.width =
        "100%";

    copia.style.height =
        "auto";


    wrapper.appendChild(
        copia
    );


    const overlay =
        document.createElement(
            "div"
        );

    overlay.className =
        "overlay";


    wrapper.appendChild(
        overlay
    );


    contenedor.appendChild(
        wrapper
    );


    return {

        wrapper,

        svg:copia,

        overlay
    };
}


/* ============================================================
   ESCALA VISUAL
============================================================ */

function obtenerEscala(
    svg,
    wrapper
){

    const vb =
        svg.viewBox.baseVal;


    if(
        vb &&
        vb.width &&
        vb.height
    ){

        return {

            sx:
                wrapper.clientWidth/
                vb.width,

            sy:
                wrapper.clientHeight/
                vb.height,

            ox:
                -vb.x,

            oy:
                -vb.y
        };
    }


    return {

        sx:1,
        sy:1,
        ox:0,
        oy:0
    };
}


/* ============================================================
   DIBUJAR
============================================================ */

function dibujarOverlay(
    pagina
){

    const wrapper =
        pagina.wrapper;

    const overlay =
        pagina.overlay;

    const svg =
        pagina.svgMostrado;


    const escala =
        obtenerEscala(
            svg,
            wrapper
        );


    /*
       LÍNEAS
    */

    for(
        let i=0;
        i<pagina.pentagramas.length;
        i++
    ){

        const p =
            pagina.pentagramas[i];


        for(
            const linea
            of p.lineas
        ){

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "linea-pentagrama";


            div.style.left =
                (
                    (
                        linea.x1+
                        escala.ox
                    )*
                    escala.sx
                )+"px";


            div.style.top =
                (
                    (
                        linea.y+
                        escala.oy
                    )*
                    escala.sy
                )+"px";


            div.style.width =
                (
                    linea.width*
                    escala.sx
                )+"px";


            overlay.appendChild(
                div
            );
        }


        const label =
            document.createElement(
                "div"
            );

        label.className =
            "pentagrama-label";

        label.textContent =
            "P"+(i+1);


        label.style.left =
            (
                (
                    p.x1+
                    escala.ox
                )*
                escala.sx
            )+"px";


        label.style.top =
            (
                (
                    p.top+
                    escala.oy
                )*
                escala.sy-
                17
            )+"px";


        overlay.appendChild(
            label
        );
    }


    /*
       NOTAS
    */

    for(
        const nota
        of pagina.notas
    ){

        const punto =
            document.createElement(
                "div"
            );


        if(
            nota.pitch &&
            nota.confidence>=.85
        ){

            punto.className =
                "nota-marker nota-verde";

        }else if(
            nota.pitch
        ){

            punto.className =
                "nota-marker nota-amarilla";

        }else{

            punto.className =
                "nota-marker nota-roja";
        }


        punto.title =
            [
                `Nota ${nota.id}`,

                `P=${nota.pentagrama ?? "?"}`,

                `X=${nota.x.toFixed(2)}`,

                `Y=${nota.y.toFixed(2)}`,

                `Pitch=${nota.pitch ?? "?"}`,

                `MIDI=${nota.midi ?? "?"}`,

                `Clave=${nota.clave ?? "?"}`,

                `Confianza=${
                    nota.confidence
                    ? nota.confidence.toFixed(2)
                    : "?"
                }`
            ].join(" | ");


        punto.style.left =
            (
                (
                    nota.x+
                    escala.ox
                )*
                escala.sx
            )+"px";


        punto.style.top =
            (
                (
                    nota.y+
                    escala.oy
                )*
                escala.sy
            )+"px";


        overlay.appendChild(
            punto
        );


        /*
           Etiqueta sólo para notas
           identificadas.

           No ponemos texto a las
           1805 notas simultáneamente
           para no hacer ilegible la
           partitura.
        */

        if(
            nota.pitch
        ){

            const label =
                document.createElement(
                    "div"
                );

            label.className =
                "pitch-label";

            label.textContent =
                nota.pitch;


            label.style.left =
                (
                    (
                        nota.x+
                        escala.ox
                    )*
                    escala.sx
                )+"px";


            label.style.top =
                (
                    (
                        nota.y+
                        escala.oy
                    )*
                    escala.sy
                )+"px";


            overlay.appendChild(
                label
            );
        }
    }
}

/* ============================================================
   RECONSTRUCCIÓN TEMPORAL
============================================================ */

/*
    Esta parte NO pretende todavía adivinar
    perfectamente todas las figuras rítmicas.

    Primero construye una línea temporal
    aproximada a partir de la posición X.

    Esto nos permite generar un MIDI de prueba
    y, sobre todo, comprobar que el orden musical
    es correcto.

    La etapa posterior puede sustituir esta
    aproximación por la información de Stem/Beam.
*/


function construirTiempo(){

    for(
        const pagina
        of paginas
    ){

        /*
           Agrupamos por pentagrama/sistema.
        */

        const grupos={};


        for(
            const nota
            of pagina.notas
        ){

            const p =
                nota.pentagrama;

            if(!p)
                continue;


            if(
                !grupos[p]
            ){

                grupos[p]=[];
            }


            grupos[p].push(
                nota
            );
        }


        for(
            const clave
            of Object.keys(
                grupos
            )
        ){

            const grupo =
                grupos[clave];


            grupo.sort(
                (a,b)=>
                    a.x-b.x
            );


            /*
               Las posiciones X son
               convertidas a pasos temporales
               aproximados.

               Posteriormente esta parte será
               reemplazada por las barras y
               figuras reales.
            */

            for(
                let i=0;
                i<grupo.length;
                i++
            ){

                const nota =
                    grupo[i];


                const siguiente =
                    grupo[i+1];


                if(!siguiente){

                    nota.duracion =
                        480;

                    continue;
                }


                const dx =
                    Math.max(
                        1,
                        siguiente.x-
                        nota.x
                    );


                /*
                   Heurística:

                   notas muy próximas =
                   corcheas

                   distancia media =
                   negras

                   distancia grande =
                   blancas
                */

                if(dx<45){

                    nota.duracion =
                        240;

                }else if(dx<100){

                    nota.duracion =
                        480;

                }else{

                    nota.duracion =
                        960;
                }
            }


            let tiempo=0;


            for(
                const nota
                of grupo
            ){

                nota.tiempo =
                    tiempo;

                tiempo +=
                    nota.duracion ||
                    480;
            }
        }
    }


    /*
       Normalizar el tiempo por sistema.

       Las dos manos deben compartir
       el mismo tiempo.

       Por eso agrupamos por pares
       de pentagramas.
    */

    for(
        const pagina
        of paginas
    ){

        const sistemas =
            {};


        for(
            const nota
            of pagina.notas
        ){

            if(
                !nota.pentagrama
            )
                continue;


            const sistema =
                Math.floor(
                    (
                        nota.pentagrama-1
                    )/2
                );


            if(
                !sistemas[sistema]
            ){

                sistemas[sistema]=[];
            }


            sistemas[sistema].push(
                nota
            );
        }


        for(
            const grupo
            of Object.values(
                sistemas
            )
        ){

            const xs =
                [
                    ...new Set(
                        grupo.map(
                            n=>n.x
                        )
                    )
                ]
                .sort(
                    (a,b)=>a-b
                );


            /*
               Cada posición X recibe
               un tiempo proporcional.
            */

            if(!xs.length)
                continue;


            const xInicial =
                xs[0];


            const mapa =
                new Map();


            for(
                let i=0;
                i<xs.length;
                i++
            ){

                /*
                   Semicorchea/cuarto de
                   unidad aproximada.

                   La cuantización final
                   se hará con Stem/Beam.
                */

                mapa.set(
                    xs[i],
                    i*240
                );
            }


            for(
                const nota
                of grupo
            ){

                nota.tiempo =
                    mapa.get(
                        nota.x
                    ) ??
                    0;
            }
        }
    }
}


/* ============================================================
   MIDI
============================================================ */

/*
    Generador MIDI SMF Type 1 sencillo.

    No utiliza librerías externas.
*/


function variableLength(
    numero
){

    let buffer =
        numero & 0x7F;

    const bytes=[];


    while(
        (numero>>=7)
    ){

        buffer<<=8;

        buffer |=
            (
                (numero&0x7F) |
                0x80
            );
    }


    while(true){

        bytes.push(
            buffer&0xFF
        );


        if(
            buffer&0x80
        ){

            buffer>>>=8;

        }else{

            break;
        }
    }


    return bytes;
}


function textoBytes(
    texto
){

    return [
        ...new TextEncoder()
            .encode(
                texto
            )
    ];
}


function u16(n){

    return [
        (n>>8)&255,
        n&255
    ];
}


function u32(n){

    return [
        (n>>24)&255,
        (n>>16)&255,
        (n>>8)&255,
        n&255
    ];
}


function concatenar(
    arrays
){

    const total =
        arrays.reduce(
            (s,a)=>
                s+a.length,
            0
        );


    const resultado =
        new Uint8Array(
            total
        );


    let pos=0;


    for(
        const a
        of arrays
    ){

        resultado.set(
            a,
            pos
        );

        pos+=a.length;
    }


    return resultado;
}


/* ============================================================
   CREAR TRACK MIDI
============================================================ */

function crearTrack(
    notas,
    canal=0
){

    const eventos=[];


    /*
       Tempo.
    */

    const bpm =
        BPM_DEFAULT;


    const mpqn =
        Math.round(
            60000000/bpm
        );


    eventos.push({

        tick:0,

        prioridad:0,

        bytes:[
            0xFF,
            0x51,
            0x03,

            (mpqn>>16)&255,
            (mpqn>>8)&255,
            mpqn&255
        ]
    });


    /*
       Instrumento:
       Acoustic Grand Piano.
    */

    eventos.push({

        tick:0,

        prioridad:0,

        bytes:[
            0xC0|canal,
            0
        ]
    });


    for(
        const nota
        of notas
    ){

        if(
            nota.midi===null ||
            nota.midi===undefined
        )
            continue;


        const pitch =
            Math.max(
                0,
                Math.min(
                    127,
                    Math.round(
                        nota.midi
                    )
                )
            );


        const inicio =
            Math.max(
                0,
                Math.round(
                    nota.tiempo ||
                    0
                )
            );


        const duracion =
            Math.max(
                60,
                Math.round(
                    nota.duracion ||
                    480
                )
            );


        eventos.push({

            tick:inicio,

            prioridad:2,

            bytes:[
                0x90|canal,
                pitch,
                90
            ]
        });


        eventos.push({

            tick:
                inicio+
                duracion,

            prioridad:1,

            bytes:[
                0x80|canal,
                pitch,
                0
            ]
        });
    }


    eventos.sort(
        (a,b)=>
            a.tick-b.tick ||
            a.prioridad-b.prioridad
    );


    const track=[];

    let anterior=0;


    for(
        const evento
        of eventos
    ){

        const delta =
            Math.max(
                0,
                evento.tick-
                anterior
            );


        track.push(
            ...variableLength(
                delta
            )
        );


        track.push(
            ...evento.bytes
        );


        anterior =
            evento.tick;
    }


    /*
       Fin del track.
    */

    track.push(
        0x00,
        0xFF,
        0x2F,
        0x00
    );


    return concatenar([
        [
            0x4D,
            0x54,
            0x72,
            0x6B
        ],

        u32(track.length),

        track
    ]);
}


/* ============================================================
   GENERAR MIDI
============================================================ */

function generarMIDI(){

    log("");

    log(
        "🎹 GENERANDO MIDI..."
    );


    const notas =
        todasLasNotas
            .filter(
                n=>
                    n.midi!==null &&
                    n.midi!==undefined
            );


    log(
        `Notas con pitch: ${notas.length}`
    );


    if(!notas.length){

        log(
            "❌ No hay notas con pitch."
        );

        return;
    }


    /*
       Para esta primera versión
       usamos un solo track de piano.

       La información conserva el
       pentagrama en el JSON para la
       siguiente etapa.
    */

    const track =
        crearTrack(
            notas,
            0
        );


    /*
       Header MIDI:

       MThd
       length 6
       format 0
       one track
       480 ticks / quarter
    */

    const header =
        concatenar([

            [
                0x4D,
                0x54,
                0x68,
                0x64
            ],

            u32(6),

            u16(0),

            u16(1),

            u16(
                PULSOS_POR_NEGRA
            )
        ]);


    const archivo =
        concatenar([
            header,
            track
        ]);


    const blob =
        new Blob(
            [archivo],
            {
                type:
                    "audio/midi"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );


    a.href=url;

    a.download =
        "experience_piano_analysis.mid";


    document.body.appendChild(a);

    a.click();

    a.remove();


    setTimeout(
        ()=>{
            URL.revokeObjectURL(
                url
            );
        },
        2000
    );


    log(
        "✓ MIDI generado."
    );

    log(
        `✓ Eventos de nota: ${notas.length}`
    );
}


/* ============================================================
   ANÁLISIS PRINCIPAL
============================================================ */

async function analizar(){

    const boton =
        document.getElementById(
            "analizar"
        );


    const resultado =
        document.getElementById(
            "resultado"
        );


    boton.disabled=true;


    document.getElementById(
        "descargar"
    ).style.display=
        "none";


    document.getElementById(
        "midi"
    ).style.display=
        "none";


    resultado.innerHTML="";


    paginas=[];

    todasLasNotas=[];

    contadorGlobal=0;


    resetLog();


    log(
        "▶ INICIANDO ANÁLISIS MUSICAL..."
    );

    log("");


    try{

        for(
            let i=0;
            i<ARCHIVOS.length;
            i++
        ){

            const numeroPagina =
                i+1;


            const archivo =
                ARCHIVOS[i];


            const url =
                BASE+
                archivo;


            log(
                `📄 Página ${numeroPagina} / ${ARCHIVOS.length}`
            );


            log(
                `   ${archivo}`
            );


            log(
                "   Descargando..."
            );


            const cargado =
                await cargarSVG(
                    url
                );


            const svg =
                cargado.svg;


            log(
                `   ✓ SVG cargado — ${cargado.texto.length} caracteres`
            );


            const noteElements =
                svg.querySelectorAll(
                    ".Note"
                ).length;


            log(
                `   .Note: ${noteElements}`
            );


            /*
               CABEZAS
            */

            const notas =
                detectarCabezas(
                    svg,
                    numeroPagina
                );


            log(
                `   🔴 Cabezas: ${notas.length}`
            );


            /*
               STAFFLINES
            */

            const lineas =
                extraerLineasStaff(
                    svg
                );


            log(
                `   📏 Líneas reales: ${lineas.length}`
            );


            /*
               PENTAGRAMAS
            */

            const pentagramas =
                agruparPentagramas(
                    lineas
                );


            log(
                `   🎼 Pentagramas: ${pentagramas.length}`
            );


            /*
               ASIGNACIÓN
            */

            asignarPentagramas(
                notas,
                pentagramas
            );


            const asignadas =
                notas.filter(
                    n=>
                        n.pentagrama
                ).length;


            log(
                `   ✓ Asignadas: ${asignadas}`
            );


            /*
               PITCH
            */

            asignarPitches(
                notas,
                pentagramas
            );


            const conPitch =
                notas.filter(
                    n=>
                        n.pitch
                ).length;


            const alta =
                notas.filter(
                    n=>
                        n.pitch &&
                        n.confidence>=.85
                ).length;


            log(
                `   🎵 Con pitch: ${conPitch}`
            );


            log(
                `   🟢 Alta confianza: ${alta}`
            );


            paginas.push({

                numero:
                    numeroPagina,

                archivo,

                svg,

                notas,

                lineas,

                pentagramas,

                noteElements
            });


            todasLasNotas.push(
                ...notas
            );


            log("");
        }


        /*
           Acordes
        */

        for(
            const pagina
            of paginas
        ){

            detectarAcordes(
                pagina.notas
            );
        }


        /*
           Orden
        */

        ordenarNotas(
            paginas
        );


        /*
           Tiempo
        */

        construirTiempo();


        log(
            "================================"
        );

        log(
            "✓ ANÁLISIS MUSICAL COMPLETADO"
        );

        log(
            "================================"
        );


        const asignadas =
            todasLasNotas.filter(
                n=>
                    n.pentagrama
            ).length;


        const conPitch =
            todasLasNotas.filter(
                n=>
                    n.pitch
            ).length;


        const alta =
            todasLasNotas.filter(
                n=>
                    n.pitch &&
                    n.confidence>=.85
            ).length;


        log(
            `Total cabezas: ${todasLasNotas.length}`
        );


        log(
            `Total pentagramas: ${
                paginas.reduce(
                    (s,p)=>
                        s+
                        p.pentagramas.length,
                    0
                )
            }`
        );


        log(
            `Total asignadas: ${asignadas}`
        );


        log(
            `Total con pitch: ${conPitch}`
        );


        log(
            `Pitch alta confianza: ${alta}`
        );


        actualizarStats();


        /*
           Mostrar páginas.
        */

        for(
            const pagina
            of paginas
        ){

            const contenedor =
                document.createElement(
                    "section"
                );


            contenedor.className =
                "pagina";


            const titulo =
                document.createElement(
                    "h2"
                );


            titulo.textContent =
                `Página ${pagina.numero} — `+
                `${pagina.notas.length} cabezas`;


            contenedor.appendChild(
                titulo
            );


            const conPitchPagina =
                pagina.notas.filter(
                    n=>n.pitch
                ).length;


            const asignadasPagina =
                pagina.notas.filter(
                    n=>n.pentagrama
                ).length;


            const info =
                document.createElement(
                    "div"
                );


            info.className =
                "info";


            info.innerHTML=`

                <b>Note:</b>
                ${pagina.noteElements}

                &nbsp; | &nbsp;

                <b>Cabezas:</b>
                ${pagina.notas.length}

                &nbsp; | &nbsp;

                <b>Líneas:</b>
                ${pagina.lineas.length}

                &nbsp; | &nbsp;

                <b>Pentagramas:</b>
                ${pagina.pentagramas.length}

                &nbsp; | &nbsp;

                <b>Asignadas:</b>
                ${asignadasPagina}

                &nbsp; | &nbsp;

                <b>Pitch:</b>
                ${conPitchPagina}
            `;


            contenedor.appendChild(
                info
            );


            /*
               Mostrar SVG.
            */

            resultado.appendChild(
                contenedor
            );


            const visual =
                mostrarSVG(
                    pagina.svg,
                    contenedor
                );


            pagina.wrapper =
                visual.wrapper;

            pagina.svgMostrado =
                visual.svg;

            pagina.overlay =
                visual.overlay;


            requestAnimationFrame(
                ()=>{
                    dibujarOverlay(
                        pagina
                    );
                }
            );


            contenedor.insertAdjacentHTML(
                "beforeend",
                diagnostico(
                    pagina
                )
            );
        }


        /*
           Aviso sobre MIDI.
        */

        const aviso =
            document.createElement(
                "div"
            );


        const sinPitch =
            todasLasNotas.filter(
                n=>
                    !n.pitch
            ).length;


        if(sinPitch>0){

            aviso.className =
                "warning";

            aviso.innerHTML = `
                ⚠️ Hay ${sinPitch}
                cabezas sin pitch identificado.
                Se conservan en el JSON y se
                marcaron en rojo.
                <br><br>
                El MIDI sólo utiliza por ahora
                las notas con pitch.
            `;

        }else{

            aviso.className =
                "success";

            aviso.innerHTML = `
                ✓ Todas las cabezas tienen
                un pitch asignado.
            `;
        }


        resultado.prepend(
            aviso
        );


        document.getElementById(
            "descargar"
        ).style.display=
            "inline-block";


        document.getElementById(
            "midi"
        ).style.display=
            "inline-block";


    }catch(error){

        log("");

        log(
            "❌ ERROR"
        );

        log(
            error.message ||
            String(error)
        );


        console.error(
            error
        );

    }finally{

        boton.disabled=false;
    }
}


/* ============================================================
   EVENTOS
============================================================ */

document.getElementById(
    "analizar"
).addEventListener(
    "click",
    analizar
);


document.getElementById(
    "descargar"
).addEventListener(
    "click",
    descargarJSON
);


document.getElementById(
    "midi"
).addEventListener(
    "click",
    generarMIDI
);

</script>
