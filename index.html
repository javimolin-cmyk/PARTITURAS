<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Experience — Analizador SVG</title>

<style>

body {
    background:#181818;
    color:white;
    font-family:Arial,sans-serif;
    padding:30px;
}

button {
    padding:15px 25px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    border:0;
    border-radius:8px;
}

#analizar {
    background:#4caf50;
    color:white;
}

#estado {
    margin-top:20px;
    padding:20px;
    background:#050505;
    border-radius:8px;
    white-space:pre-wrap;
    font-family:monospace;
    line-height:1.5;
}

.pagina {
    background:white;
    color:black;
    margin-top:30px;
    padding:20px;
    border-radius:10px;
}

.pagina svg {
    max-width:100%;
    height:auto;
}

</style>
</head>

<body>

<h1>🎼 EXPERIENCE — Analizador SVG</h1>

<button id="analizar">
🔎 ANALIZAR PARTITURA
</button>

<div id="estado">
Esperando...
</div>

<div id="resultado"></div>


<script>

const archivos = [

    "EXPERIENCE%20-%20%20Ludovico%20Einaudi/score_0.svg",

    "EXPERIENCE%20-%20%20Ludovico%20Einaudi/score_1.svg",

    "EXPERIENCE%20-%20%20Ludovico%20Einaudi/score_2.svg",

    "EXPERIENCE%20-%20%20Ludovico%20Einaudi/score_3.svg",

    "EXPERIENCE%20-%20%20Ludovico%20Einaudi/score_4.svg"

];


const estado =
    document.getElementById("estado");


const resultado =
    document.getElementById("resultado");


function separarSubpaths(d) {

    if (!d)
        return [];

    const posiciones = [];

    const regex = /[Mm](?=[-+.\d])/g;

    let match;

    while (
        (match = regex.exec(d))
        !== null
    ) {

        posiciones.push(
            match.index
        );

    }

    const resultado = [];

    for (
        let i = 0;
        i < posiciones.length;
        i++
    ) {

        const inicio =
            posiciones[i];

        const fin =
            i + 1 < posiciones.length
            ? posiciones[i + 1]
            : d.length;

        const subpath =
            d.slice(
                inicio,
                fin
            ).trim();

        if (subpath)
            resultado.push(subpath);

    }

    return resultado;
}


async function analizar() {

    estado.textContent =
        "▶ Botón funcionando.\n\n" +
        "Comenzando análisis...";


    resultado.innerHTML = "";


    try {

        for (
            let i = 0;
            i < archivos.length;
            i++
        ) {

            estado.textContent +=
                "\n\n📄 Página " +
                (i + 1) +
                "\n" +
                "URL: " +
                archivos[i] +
                "\n" +
                "Descargando...";


            const respuesta =
                await fetch(
                    archivos[i],
                    {
                        cache:"no-store"
                    }
                );


            if (!respuesta.ok) {

                throw new Error(
                    "No se pudo cargar " +
                    archivos[i] +
                    "\nHTTP " +
                    respuesta.status
                );

            }


            const texto =
                await respuesta.text();


            estado.textContent +=
                "\n✓ SVG descargado" +
                "\nTamaño: " +
                texto.length +
                " caracteres";


            const parser =
                new DOMParser();


            const doc =
                parser.parseFromString(
                    texto,
                    "image/svg+xml"
                );


            const error =
                doc.querySelector(
                    "parsererror"
                );


            if (error) {

                throw new Error(
                    "El SVG de la página " +
                    (i + 1) +
                    " no pudo ser interpretado."
                );

            }


            const svg =
                doc.documentElement;


            const notes =
                svg.querySelectorAll(
                    ".Note"
                );


            const stems =
                svg.querySelectorAll(
                    ".Stem"
                );


            const beams =
                svg.querySelectorAll(
                    ".Beam"
                );


            const bars =
                svg.querySelectorAll(
                    ".BarLine"
                );


            const staff =
                svg.querySelectorAll(
                    ".StaffLines"
                );


            estado.textContent +=

                "\n✓ SVG válido" +

                "\n.Note: " +
                notes.length +

                "\n.Stem: " +
                stems.length +

                "\n.Beam: " +
                beams.length +

                "\n.BarLine: " +
                bars.length +

                "\n.StaffLines: " +
                staff.length;


            let totalSubpaths = 0;


            for (
                const note of notes
            ) {

                const d =
                    note.getAttribute(
                        "d"
                    );


                const subpaths =
                    separarSubpaths(d);


                totalSubpaths +=
                    subpaths.length;

            }


            estado.textContent +=

                "\nSubpaths dentro de .Note: " +
                totalSubpaths;


            /*
            Mostrar SVG
            */

            const pagina =
                document.createElement(
                    "div"
                );


            pagina.className =
                "pagina";


            const titulo =
                document.createElement(
                    "h2"
                );


            titulo.textContent =
                "Página " +
                (i + 1);


            pagina.appendChild(
                titulo
            );


            /*
            Para mostrarlo usamos
            directamente el SVG.
            */

            const svgVisual =
                document.importNode(
                    svg,
                    true
                );


            pagina.appendChild(
                svgVisual
            );


            resultado.appendChild(
                pagina
            );

        }


        estado.textContent +=

            "\n\n============================" +

            "\n✓ ANÁLISIS TERMINADO" +

            "\n============================" +

            "\n\nLos 5 SVG fueron cargados correctamente.";


    }
    catch(error) {

        console.error(error);


        estado.textContent +=

            "\n\n❌ ERROR\n\n" +

            error.message;


    }

}


document
    .getElementById("analizar")
    .addEventListener(
        "click",
        analizar
    );

</script>

</body>
</html>
