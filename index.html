<script>

/* ============================================================
   CONFIGURACIÓN
============================================================ */

const BASE =
"EXPERIENCE%20-%20%20Ludovico%20Einaudi/";

const ARCHIVOS = [
    "score_0.svg",
    "score_1.svg",
    "score_2.svg",
    "score_3.svg",
    "score_4.svg"
];

const estado = {

    paginas: [],

    eventos: [],

    midi: null,

    tempo: 64,

    timeNumerator: 4,

    timeDenominator: 4,

    keySignature: 0

};


/* ============================================================
   LOG
============================================================ */

function log(text){

    const el =
        document.getElementById("log");

    el.textContent += text + "\n";

    el.scrollTop =
        el.scrollHeight;
}


function limpiarLog(){

    document.getElementById(
        "log"
    ).textContent = "";

}


/* ============================================================
   PARSER DE PATH SVG
============================================================ */

function parsePath(d){

    const tokens =
        d.match(
            /[a-zA-Z]|[-+]?(?:\d*\.\d+|\d+\.?)(?:e[-+]?\d+)?/ig
        ) || [];

    let i = 0;

    let cmd = "";

    let x = 0;
    let y = 0;

    const xs = [];
    const ys = [];

    function num(){

        return parseFloat(
            tokens[i++]
        ) || 0;

    }

    while(i < tokens.length){

        if(/[a-zA-Z]/.test(tokens[i])){

            cmd = tokens[i++];

        }

        if(!cmd)
            continue;

        const c =
            cmd.toLowerCase();

        if(c === "z"){

            cmd = "";

            continue;
        }

        const relative =
            cmd === c;


        if(c === "m" || c === "l"){

            if(i + 1 >= tokens.length)
                break;

            const a = num();
            const b = num();

            if(relative){

                x += a;
                y += b;

            }else{

                x = a;
                y = b;

            }

            xs.push(x);
            ys.push(y);

            if(c === "m"){

                cmd =
                    relative
                    ? "l"
                    : "L";

            }

        }


        else if(c === "h"){

            const a = num();

            x =
                relative
                ? x + a
                : a;

            xs.push(x);
            ys.push(y);

        }


        else if(c === "v"){

            const a = num();

            y =
                relative
                ? y + a
                : a;

            xs.push(x);
            ys.push(y);

        }


        else if(c === "c"){

            for(let k=0;k<3;k++){

                const a = num();
                const b = num();

                if(relative){

                    x += a;
                    y += b;

                }else{

                    x = a;
                    y = b;

                }

                xs.push(x);
                ys.push(y);
            }

        }


        else if(c === "s" || c === "q"){

            for(let k=0;k<2;k++){

                const a = num();
                const b = num();

                if(relative){

                    x += a;
                    y += b;

                }else{

                    x = a;
                    y = b;

                }

                xs.push(x);
                ys.push(y);
            }

        }


        else if(c === "t"){

            const a = num();
            const b = num();

            if(relative){

                x += a;
                y += b;

            }else{

                x = a;
                y = b;

            }

            xs.push(x);
            ys.push(y);

        }


        else if(c === "a"){

            /*
             rx ry rotation largeArc sweep x y
            */

            num();
            num();
            num();
            num();
            num();

            const a = num();
            const b = num();

            if(relative){

                x += a;
                y += b;

            }else{

                x = a;
                y = b;

            }

            xs.push(x);
            ys.push(y);

        }


        else{

            i++;

        }

    }

    if(!xs.length)
        return null;

    const minX =
        Math.min(...xs);

    const maxX =
        Math.max(...xs);

    const minY =
        Math.min(...ys);

    const maxY =
        Math.max(...ys);

    return {

        x:minX,
        y:minY,

        x2:maxX,
        y2:maxY,

        width:maxX-minX,
        height:maxY-minY

    };

}


/* ============================================================
   SUBPATHS
============================================================ */

function obtenerSubpaths(path){

    const d =
        path.getAttribute("d") || "";

    const indices =
        [...d.matchAll(/[Mm]/g)]
        .map(x => x.index);

    const result = [];

    for(let i=0;i<indices.length;i++){

        const inicio =
            indices[i];

        const fin =
            i+1 < indices.length
            ? indices[i+1]
            : d.length;

        const parte =
            d.substring(
                inicio,
                fin
            );

        const bounds =
            parsePath(parte);

        if(bounds)
            result.push(bounds);

    }

    return result;

}


/* ============================================================
   BOUNDS DE ELEMENTO
============================================================ */

function boundsElemento(el){

    const d =
        el.getAttribute("d");

    if(d)
        return parsePath(d);

    const x =
        parseFloat(
            el.getAttribute("x")
        );

    const y =
        parseFloat(
            el.getAttribute("y")
        );

    const width =
        parseFloat(
            el.getAttribute("width")
        );

    const height =
        parseFloat(
            el.getAttribute("height")
        );

    if(
        Number.isFinite(x) &&
        Number.isFinite(y)
    ){

        return {

            x,
            y,

            x2:x+(width||0),
            y2:y+(height||0),

            width:width||0,
            height:height||0

        };

    }

    return null;

}


/* ============================================================
   DETECTAR CABEZAS
============================================================ */

function detectarCabezas(svg){

    const result = [];

    svg.querySelectorAll(".Note")
    .forEach(
        (note,noteIndex)=>{

            obtenerSubpaths(note)
            .forEach(
                (b,subIndex)=>{

                    /*
                     * Las cabezas detectadas
                     * previamente están en esta
                     * escala geométrica.
                     */

                    if(
                        b.width >= 8 &&
                        b.width <= 90 &&
                        b.height >= 8 &&
                        b.height <= 90
                    ){

                        result.push({

                            x:
                                b.x +
                                b.width/2,

                            y:
                                b.y +
                                b.height/2,

                            width:b.width,
                            height:b.height,

                            noteIndex,
                            subIndex

                        });

                    }

                }
            );

        }
    );

    return result;

}


/* ============================================================
   STAFFLINES REALES
============================================================ */

function detectarLineasStaff(svg){

    const lineas = [];

    svg.querySelectorAll(
        ".StaffLines"
    )
    .forEach(el=>{

        obtenerSubpaths(el)
        .forEach(b=>{

            if(
                b.width > 100
            ){

                lineas.push(b);

            }

        });

    });

    return lineas.sort(
        (a,b)=>a.y-b.y
    );

}


/* ============================================================
   AGRUPAR LAS 5 LÍNEAS
============================================================ */

function agruparPentagramas(lineas){

    /*
     * En lugar de confiar únicamente en
     * la distancia entre líneas, usamos
     * el patrón de 5 líneas.
     */

    const grupos = [];

    const usadas =
        new Set();

    for(
        let i=0;
        i<lineas.length;
        i++
    ){

        if(usadas.has(i))
            continue;

        const base =
            lineas[i];

        const grupo = [
            base
        ];

        usadas.add(i);

        for(
            let j=i+1;
            j<lineas.length &&
            grupo.length<5;
            j++
        ){

            if(usadas.has(j))
                continue;

            const distancia =
                lineas[j].y -
                grupo[
                    grupo.length-1
                ].y;

            /*
             * El espacio entre líneas
             * de un pentagrama debe ser
             * relativamente pequeño.
             */

            if(
                distancia > 3 &&
                distancia < 45
            ){

                grupo.push(
                    lineas[j]
                );

                usadas.add(j);

            }

        }

        if(grupo.length >= 4){

            const arriba =
                Math.min(
                    ...grupo.map(
                        x=>x.y
                    )
                );

            const abajo =
                Math.max(
                    ...grupo.map(
                        x=>x.y
                    )
                );

            const centro =
                (arriba+abajo)/2;

            const espacio =
                grupo.length > 1
                ? (
                    grupo[
                        grupo.length-1
                    ].y -
                    grupo[0].y
                ) /
                (grupo.length-1)
                : 10;

            grupos.push({

                lineas:grupo,

                arriba,
                abajo,
                centro,

                espacio

            });

        }

    }

    return grupos.sort(
        (a,b)=>
            a.centro-b.centro
    );

}


/* ============================================================
   ELEMENTOS MUSICALES
============================================================ */

const CLASES_MUSICALES = [

    "Stem",
    "Beam",
    "BarLine",
    "Rest",
    "KeySig",
    "TimeSig",
    "Clef",
    "TieSegment",
    "OttavaSegment",
    "VoltaSegment",
    "Dynamic",
    "Fermata",
    "HairpinSegment",
    "GradualTempoChangeSegment",
    "Tempo",
    "Expression"

];


function detectarElementos(svg){

    const elementos = {};

    for(
        const clase
        of CLASES_MUSICALES
    ){

        elementos[clase] = [];

        svg.querySelectorAll(
            "."+clase
        )
        .forEach(el=>{

            elementos[clase].push({

                element:el,

                bounds:
                    boundsElemento(el)

            });

        });

    }

    return elementos;

}


/* ============================================================
   STAFF MÁS CERCANO
============================================================ */

function staffMasCercano(
    y,
    pentagramas
){

    let mejor = null;

    let distancia =
        Infinity;

    for(
        let i=0;
        i<pentagramas.length;
        i++
    ){

        const staff =
            pentagramas[i];

        let d;

        if(
            y < staff.arriba
        ){

            d =
                staff.arriba-y;

        }
        else if(
            y > staff.abajo
        ){

            d =
                y-staff.abajo;

        }
        else{

            d=0;

        }

        if(d < distancia){

            distancia=d;

            mejor={

                ...staff,

                index:i,

                distancia:d

            };

        }

    }

    return mejor;

}


/* ============================================================
   PITCH
============================================================ */

function pitchDesdeStaff(
    y,
    staff
){

    if(!staff)
        return null;

    /*
     * Una distancia vertical de medio
     * espacio corresponde a un grado
     * diatónico.
     */

    const espacio =
        Math.max(
            1,
            staff.espacio
        );

    const pasos =
        Math.round(
            (
                staff.centro-y
            ) /
            (espacio/2)
        );

    /*
     * MIDI aproximado.
     *
     * Pentagramas pares:
     * clave de Sol.
     *
     * Pentagramas impares:
     * clave de Fa.
     *
     * Esta regla podrá sustituirse
     * posteriormente por detección real
     * de Clef.
     */

    const esFa =
        staff.index % 2 === 1;

    /*
     * Nota base para la posición
     * central aproximada.
     */

    const base =
        esFa
        ? 50
        : 71;

    /*
     * grados diatónicos
     */

    const escala = [
        0,2,4,5,7,9,11
    ];

    const octava =
        Math.floor(
            pasos/7
        );

    const grado =
        (
            (
                pasos % 7
            ) + 7
        ) % 7;

    let midi =
        base +
        octava*12 +
        escala[grado];

    /*
     * Aplicar armadura.
     */

    midi +=
        estado.keySignature;

    /*
     * Octava.
     */

    midi =
        Math.max(
            21,
            Math.min(
                108,
                Math.round(midi)
            )
        );

    return midi;

}


/* ============================================================
   DETECTAR ARMADURA
============================================================ */

function detectarKeySignature(
    elementos
){

    const keys =
        elementos.KeySig || [];

    /*
     * El SVG no siempre expone el número
     * de alteraciones directamente.
     *
     * Por ahora guardamos la presencia
     * de KeySig y usamos 0 como valor
     * neutral si no puede inferirse.
     */

    if(keys.length){

        return 0;

    }

    return 0;

}


/* ============================================================
   DETECTAR COMPÁS
============================================================ */

function detectarTimeSignature(
    elementos
){

    const times =
        elementos.TimeSig || [];

    if(!times.length){

        return {
            numerator:4,
            denominator:4

        };

    }

    /*
     * Experience normalmente se trabaja
     * en 4/4.
     *
     * El parser queda preparado para
     * sustituir esta detección por la
     * lectura de los glyphs del SVG.
     */

    return {

        numerator:4,
        denominator:4

    };

}


/* ============================================================
   DETECTAR TEMPO
============================================================ */

function detectarTempo(
    elementos
){

    if(
        elementos.Tempo &&
        elementos.Tempo.length
    ){

        /*
         * Si MuseScore no expone el valor
         * como atributo textual, usamos
         * el tempo conocido de la obra
         * como fallback inicial.
         */

        return 64;

    }

    return 64;

}


/* ============================================================
   CONTAR BEAMS POR NOTA
============================================================ */

function contarBeamsCercanos(
    nota,
    elementos
){

    const beams =
        elementos.Beam || [];

    let cantidad=0;

    for(
        const beam
        of beams
    ){

        const b =
            beam.bounds;

        if(!b)
            continue;

        const cx =
            (b.x+b.x2)/2;

        const cy =
            (b.y+b.y2)/2;

        const dx =
            Math.abs(
                cx-nota.x
            );

        const dy =
            Math.abs(
                cy-nota.y
            );

        /*
         * Los beams de MuseScore pueden
         * ser largos. Lo importante es que
         * estén en la zona de la cabeza.
         */

        if(
            dx < 70 &&
            dy < 80
        ){

            cantidad++;

        }

    }

    return cantidad;

}


/* ============================================================
   INFERIR FIGURA RÍTMICA
============================================================ */

function inferirDuracion(
    nota,
    elementos
){

    const beams =
        contarBeamsCercanos(
            nota,
            elementos
        );

    /*
     * 0 beams:
     * negra por defecto.
     *
     * 1 beam:
     * corchea.
     *
     * 2:
     * semicorchea.
     *
     * 3:
     * fusa.
     */

    if(beams >= 3)
        return 0.125;

    if(beams === 2)
        return 0.25;

    if(beams === 1)
        return 0.5;

    return 1;

}


/* ============================================================
   BARRAS
============================================================ */

function obtenerBarlines(
    elementos
){

    return (
        elementos.BarLine || []
    )
    .map(x=>{

        if(!x.bounds)
            return null;

        return {

            x:
                (
                    x.bounds.x+
                    x.bounds.x2
                )/2,

            y:
                (
                    x.bounds.y+
                    x.bounds.y2
                )/2

        };

    })
    .filter(Boolean)
    .sort(
        (a,b)=>a.x-b.x
    );

}


/* ============================================================
   ASIGNAR CABEZAS
============================================================ */

function asignarCabezas(
    page
){

    const notas=[];

    for(
        const cabeza
        of page.cabezas
    ){

        const staff =
            staffMasCercano(
                cabeza.y,
                page.pentagramas
            );

        if(!staff)
            continue;

        const pitch =
            pitchDesdeStaff(
                cabeza.y,
                staff
            );

        const duracion =
            inferirDuracion(
                cabeza,
                page.elementos
            );

        const beams =
            contarBeamsCercanos(
                cabeza,
                page.elementos
            );

        notas.push({

            ...cabeza,

            staff:
                staff.index,

            pitch,

            distanciaStaff:
                staff.distancia,

            beams,

            duracion,

            confianza:
                staff.distancia <=
                staff.espacio
                ? 1
                : staff.distancia <=
                staff.espacio*2
                ? .85
                : .60

        });

    }

    /*
     * Orden musical:
     *
     * primero por staff,
     * después X,
     * después Y.
     */

    notas.sort(
        (a,b)=>
            a.staff-b.staff ||
            a.x-b.x ||
            a.y-b.y
    );

    return notas;

}


/* ============================================================
   AGRUPAR ACORDES
============================================================ */

function detectarEventos(
    notas
){

    const eventos=[];

    /*
     * Un evento representa una posición
     * temporal.
     *
     * Varias cabezas en X similar
     * forman un acorde.
     */

    for(
        const nota
        of notas
    ){

        let evento =
            null;

        /*
         * Buscar evento próximo.
         */

        for(
            const e
            of eventos
        ){

            if(
                Math.abs(
                    e.x-
                    nota.x
                ) < 15
            ){

                evento=e;
                break;

            }

        }

        if(!evento){

            evento={

                x:nota.x,

                notas:[],

                staffs:new Set(),

                duracion:
                    nota.duracion

            };

            eventos.push(
                evento
            );

        }

        evento.notas.push(
            nota
        );

        evento.staffs.add(
            nota.staff
        );

        evento.duracion =
            Math.min(
                evento.duracion,
                nota.duracion
            );

    }

    /*
     * Convertir Sets.
     */

    for(
        const evento
        of eventos
    ){

        evento.staffs =
            [...evento.staffs];

    }

    eventos.sort(
        (a,b)=>a.x-b.x
    );

    return eventos;

}


/* ============================================================
   CONSTRUIR TIEMPO A PARTIR DE POSICIONES X
============================================================ */

function construirTiempo(
    eventos
){

    if(!eventos.length)
        return [];

    /*
     * No utilizamos únicamente la
     * distancia geométrica.
     *
     * Primero calculamos diferencias
     * entre eventos.
     */

    const distancias=[];

    for(
        let i=1;
        i<eventos.length;
        i++
    ){

        const d =
            eventos[i].x-
            eventos[i-1].x;

        if(
            d > 2 &&
            d < 500
        ){

            distancias.push(d);

        }

    }

    if(!distancias.length)
        return eventos;

    /*
     * Mediana.
     */

    distancias.sort(
        (a,b)=>a-b
    );

    const mediana =
        distancias[
            Math.floor(
                distancias.length/2
            )
        ];

    /*
     * La mediana representa
     * aproximadamente una negra,
     * aunque en partituras con muchos
     * cambios puede representar una
     * subdivisión.
     */

    let tiempo=0;

    for(
        let i=0;
        i<eventos.length;
        i++
    ){

        if(i===0){

            eventos[i].tick=0;

        }else{

            const dx =
                eventos[i].x-
                eventos[i-1].x;

            /*
             * Normalización geométrica.
             *
             * 1 unidad = negra.
             */

            let negras =
                dx/mediana;

            /*
             * Cuantización musical.
             */

            const candidatos = [

                2,
                1,
                0.5,
                0.25,
                0.125

            ];

            let mejor =
                candidatos[0];

            let error =
                Infinity;

            for(
                const c
                of candidatos
            ){

                const e =
                    Math.abs(
                        negras-c
                    );

                if(e<error){

                    error=e;
                    mejor=c;

                }

            }

            tiempo += mejor;

            eventos[i].tick =
                tiempo;

        }

    }

    return eventos;

}


/* ============================================================
   LIGADURAS
============================================================ */

function aplicarLigaduras(
    page
){

    const ties =
        page.elementos
        .TieSegment || [];

    /*
     * Guardamos la información para
     * la etapa MIDI.
     */

    for(
        const nota
        of page.notas
    ){

        nota.tie=false;

        for(
            const tie
            of ties
        ){

            if(!tie.bounds)
                continue;

            const cx =
                (
                    tie.bounds.x+
                    tie.bounds.x2
                )/2;

            if(
                Math.abs(
                    cx-nota.x
                )<30
            ){

                nota.tie=true;

                break;

            }

        }

    }

}


/* ============================================================
   OCTAVAS
============================================================ */

function aplicarOttava(
    page
){

    const ottavas =
        page.elementos
        .OttavaSegment || [];

    for(
        const nota
        of page.notas
    ){

        nota.ottava=0;

        for(
            const ottava
            of ottavas
        ){

            if(!ottava.bounds)
                continue;

            if(
                nota.x >=
                ottava.bounds.x &&
                nota.x <=
                ottava.bounds.x2
            ){

                /*
                 * Por ahora asumimos 8va.
                 *
                 * La lectura de 8va/8vb se
                 * podrá obtener del glyph.
                 */

                nota.ottava=12;

            }

        }

        if(
            nota.pitch !== null
        ){

            nota.pitch =
                Math.max(
                    21,
                    Math.min(
                        108,
                        nota.pitch+
                        nota.ottava
                    )
                );

        }

    }

}


/* ============================================================
   DINÁMICAS
============================================================ */

function detectarDinamicas(
    page
){

    const dinamicas =
        page.elementos.Dynamic || [];

    return dinamicas
        .filter(
            x=>x.bounds
        )
        .map(x=>({

            x:
                (
                    x.bounds.x+
                    x.bounds.x2
                )/2,

            y:
                (
                    x.bounds.y+
                    x.bounds.y2
                )/2

        }));

}

async function analizarPagina(
    numero
){

    const archivo =
        ARCHIVOS[numero];

    const url =
        BASE+
        archivo;

    log(
        `📄 Página ${numero+1} / ${ARCHIVOS.length}`
    );

    log(
        `   ${archivo}`
    );

    log(
        `   Descargando...`
    );

    const respuesta =
        await fetch(url);

    if(!respuesta.ok){

        throw new Error(
            `HTTP ${respuesta.status}`
        );

    }

    const texto =
        await respuesta.text();

    log(
        `   ✓ SVG cargado — ${texto.length} caracteres`
    );

    const parser =
        new DOMParser();

    const doc =
        parser.parseFromString(
            texto,
            "image/svg+xml"
        );

    const svg =
        doc.documentElement;

    if(
        !svg ||
        svg.nodeName.toLowerCase() !== "svg"
    ){

        throw new Error(
            "SVG inválido"
        );

    }

    const notas =
        detectarCabezas(svg);

    const lineas =
        detectarLineasStaff(svg);

    const pentagramas =
        agruparPentagramas(
            lineas
        );

    const elementos =
        detectarElementos(svg);

    log(
        `   .Note: ${svg.querySelectorAll(".Note").length}`
    );

    log(
        `   🔴 Cabezas: ${notas.length}`
    );

    log(
        `   📏 Líneas: ${lineas.length}`
    );

    log(
        `   🎼 Pentagramas: ${pentagramas.length}`
    );

    for(
        const clase
        of CLASES_MUSICALES
    ){

        const cantidad =
            elementos[clase].length;

        if(cantidad){

            log(
                `   ├ ${clase}: ${cantidad}`
            );

        }

    }

    const page={

        numero:numero+1,

        archivo,

        svg,

        texto,

        cabezas:notas,

        lineas,

        pentagramas,

        elementos,

        notas:[],

        eventos:[],

        dinamicas:[]

    };


    page.notas =
        asignarCabezas(
            page
        );


    page.eventos =
        detectarEventos(
            page.notas
        );


    page.eventos =
        construirTiempo(
            page.eventos
        );


    aplicarLigaduras(
        page
    );


    aplicarOttava(
        page
    );


    page.dinamicas =
        detectarDinamicas(
            page
        );


    log(
        `   ✓ Asignadas: ${page.notas.length}`
    );

    log(
        `   🎵 Eventos/acordes: ${page.eventos.length}`
    );

    log(
        `   🎵 Con pitch: ${
            page.notas.filter(
                n=>n.pitch!==null
            ).length
        }`
    );

    const alta =
        page.notas.filter(
            n=>n.confianza>=.85
        ).length;

    log(
        `   🟢 Alta confianza: ${alta}`
    );

    return page;

}

/* ============================================================
   MIDI
============================================================ */

/*
 * MIDI Standard:
 *
 * Header:
 * MThd
 *
 * Track:
 * MTrk
 *
 * PPQ = 480
 */

const PPQ=480;


function midiVarLen(
    value
){

    value =
        Math.max(
            0,
            Math.floor(value)
        );

    let buffer =
        value & 0x7f;

    const bytes=[];

    while(
        (value >>= 7)
    ){

        buffer <<= 8;

        buffer |=
            ((value & 0x7f)|0x80);

    }

    while(true){

        bytes.push(
            buffer & 0xff
        );

        if(
            buffer & 0x80
        ){

            buffer >>= 8;

        }else{

            break;

        }

    }

    return bytes;

}


function uint32(n){

    return [

        (n>>24)&255,
        (n>>16)&255,
        (n>>8)&255,
        n&255

    ];

}


function uint16(n){

    return [

        (n>>8)&255,
        n&255

    ];

}


function textoBytes(text){

    return [
        ...new TextEncoder()
        .encode(text)
    ];

}


/* ============================================================
   CREAR MIDI
============================================================ */

function crearMIDI(){

    const eventos=[];

    /*
     * Convertir todos los eventos
     * visuales a ticks MIDI.
     */

    let globalTick=0;

    for(
        const page
        of estado.paginas
    ){

        /*
         * Cada página continúa temporalmente
         * después de la anterior.
         */

        for(
            const evento
            of page.eventos
        ){

            const tick =
                globalTick+
                Math.round(
                    evento.tick*PPQ
                );

            eventos.push({

                tick,

                notas:
                    evento.notas,

                duracion:
                    evento.duracion

            });

        }

        /*
         * Separación de página.
         *
         * Se estima a partir del último
         * evento.
         */

        if(
            page.eventos.length
        ){

            const ultimo =
                page.eventos[
                    page.eventos.length-1
                ];

            globalTick +=
                Math.round(
                    (
                        ultimo.tick+
                        4
                    )*PPQ
                );

        }

    }


    /*
     * Ordenar.
     */

    eventos.sort(
        (a,b)=>a.tick-b.tick
    );


    const track=[];

    /*
     * Tempo.
     *
     * Microsegundos por negra.
     */

    const micros =
        Math.round(
            60000000/
            estado.tempo
        );


    /*
     * Delta 0
     * Meta tempo.
     */

    track.push(
        ...midiVarLen(0),
        0xff,
        0x51,
        0x03,
        (micros>>16)&255,
        (micros>>8)&255,
        micros&255
    );


    /*
     * Compás.
     */

    track.push(
        ...midiVarLen(0),
        0xff,
        0x58,
        0x04,
        estado.timeNumerator,
        Math.round(
            Math.log2(
                estado.timeDenominator
            )
        ),
        24,
        8
    );


    /*
     * Nombre.
     */

    const nombre =
        textoBytes(
            "Experience - Ludovico Einaudi"
        );

    track.push(
        ...midiVarLen(0),
        0xff,
        0x03,
        nombre.length,
        ...nombre
    );


    let anteriorTick=0;


    /*
     * Canal piano.
     */

    const canal=0;


    for(
        const evento
        of eventos
    ){

        const tick =
            Math.max(
                0,
                evento.tick
            );

        const delta =
            tick-anteriorTick;


        /*
         * Cada nota del acorde.
         */

        const duracionTicks =
            Math.max(
                30,
                Math.round(
                    evento.duracion*
                    PPQ
                )
            );


        /*
         * NOTE ON.
         */

        let primero=true;

        for(
            const nota
            of evento.notas
        ){

            if(
                nota.pitch===null
            )
                continue;


            let pitch =
                nota.pitch;


            /*
             * Protección.
             */

            pitch =
                Math.max(
                    21,
                    Math.min(
                        108,
                        Math.round(
                            pitch
                        )
                    )
                );


            track.push(

                ...midiVarLen(
                    primero
                    ? delta
                    : 0
                ),

                0x90 | canal,

                pitch,

                82

            );

            primero=false;

        }


        /*
         * NOTE OFF.
         *
         * En este punto usamos el
         * mismo evento temporal.
         */

        for(
            const nota
            of evento.notas
        ){

            if(
                nota.pitch===null
            )
                continue;


            let pitch =
                Math.max(
                    21,
                    Math.min(
                        108,
                        Math.round(
                            nota.pitch
                        )
                    )
                );


            track.push(

                ...midiVarLen(
                    duracionTicks
                ),

                0x80 | canal,

                pitch,

                0

            );

        }


        anteriorTick =
            tick+
            duracionTicks;

    }


    /*
     * Fin de pista.
     */

    track.push(

        ...midiVarLen(0),

        0xff,
        0x2f,
        0x00

    );


    /*
     * Header.
     */

    const header = [

        ...textoBytes("MThd"),

        0,
        0,
        0,
        6,

        ...uint16(0),

        ...uint16(1),

        ...uint16(PPQ)

    ];


    /*
     * Track chunk.
     */

    const trackChunk=[

        ...textoBytes("MTrk"),

        ...uint32(
            track.length
        ),

        ...track

    ];


    const bytes =
        new Uint8Array([
            ...header,
            ...trackChunk
        ]);


    return new Blob(
        [bytes],
        {
            type:"audio/midi"
        }
    );

}

    a.remove();

    setTimeout(
        ()=>URL.revokeObjectURL(url),
        1000
    );

}


/* ============================================================
   ESCAPAR HTML
============================================================ */

function escapeHtml(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}
