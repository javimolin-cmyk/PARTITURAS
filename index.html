<!DOCTYPE html>

<style>

<body>


<h1>
🎼 EXPERIENCE — Reconstrucción de pentagramas
</h1>


<p>
Las cabezas se detectan directamente desde los SVG de MuseScore.
</p>


<button id="analizar">
🔎 ANALIZAR PARTITURA
</button>


<button id="descargar">
⬇️ DESCARGAR JSON
</button>


<div id="estado">
Esperando...
</div>


<div id="stats"
     class="stats">
</div>


<div id="resultado"></div>


<script>


/* =========================================================
   CONFIGURACIÓN
========================================================= */


const BASE =
"EXPERIENCE%20-%20%20Ludovico%20Einaudi/";


const ARCHIVOS = [

    "score_0.svg",
    "score_1.svg",
    "score_2.svg",
    "score_3.svg",
    "score_4.svg"

];


let paginas = [];

let todasLasNotas = [];

let contadorGlobal = 0;


/* =========================================================
   UTILIDADES
========================================================= */


function numero(v) {

    const n =
        parseFloat(v);

    return Number.isFinite(n)
        ? n
        : 0;

}


function distancia(a, b) {

    return Math.abs(a - b);

}


/* =========================================================
   SUBPATHS
========================================================= */


function separarSubpaths(d) {

    if (!d)
        return [];


    const posiciones = [];

    const regex =
        /[Mm](?=[-+.\d])/g;


    let match;


    while (
        (match =
            regex.exec(d))
        !== null
    ) {

        posiciones.push(
            match.index
        );

    }


    const resultado = [];


    for (
        let i = 0;
        i < posiciones.length;
        i++
    ) {

        const inicio =
            posiciones[i];


        const fin =
            i + 1 <
            posiciones.length

                ? posiciones[i + 1]

                : d.length;


        const parte =
            d.slice(
                inicio,
                fin
            ).trim();


        if (parte)
            resultado.push(parte);

    }


    return resultado;

}


/* =========================================================
   BBOX
========================================================= */


let svgTemporal = null;


function getSVGTemporal() {

    if (svgTemporal)
        return svgTemporal;


    svgTemporal =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "svg"
        );


    svgTemporal.setAttribute(
        "width",
        "10000"
    );


    svgTemporal.setAttribute(
        "height",
        "10000"
    );


    svgTemporal.style.position =
        "absolute";

    svgTemporal.style.left =
        "-100000px";

    svgTemporal.style.top =
        "0";

    svgTemporal.style.visibility =
        "hidden";


    document.body.appendChild(
        svgTemporal
    );


    return svgTemporal;

}


function bboxPath(d) {

    try {

        const svg =
            getSVGTemporal();


        const path =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "path"
            );


        path.setAttribute(
            "d",
            d
        );


        svg.appendChild(
            path
        );


        const b =
            path.getBBox();


        path.remove();


        return {

            x: b.x,
            y: b.y,
            width: b.width,
            height: b.height,

            cx:
                b.x +
                b.width / 2,

            cy:
                b.y +
                b.height / 2

        };

    }
    catch {

        return null;

    }

}


/* =========================================================
   DETECTAR CABEZAS
========================================================= */


function detectarCabezas(
    svg,
    pagina
) {

    const elements =
        [
            ...svg.querySelectorAll(
                ".Note"
            )
        ];


    const notas = [];


    for (
        const element
        of elements
    ) {

        const d =
            element.getAttribute(
                "d"
            );


        if (!d)
            continue;


        const subpaths =
            separarSubpaths(d);


        for (
            const subpath
            of subpaths
        ) {

            /*
            Las cabezas que encontramos
            contienen curvas.
            */

            if (
                !/[Cc]/.test(
                    subpath
                )
            )
                continue;


            const b =
                bboxPath(
                    subpath
                );


            if (!b)
                continue;


            if (
                b.width < 5 ||
                b.height < 5
            )
                continue;


            if (
                b.width > 100 ||
                b.height > 100
            )
                continue;


            const ratio =
                b.width /
                b.height;


            if (
                ratio < 0.35 ||
                ratio > 4
            )
                continue;


            notas.push({

                id:
                    ++contadorGlobal,

                pagina,

                x:
                    b.cx,

                y:
                    b.cy,

                width:
                    b.width,

                height:
                    b.height,

                d:
                    subpath

            });

        }

    }


    return notas;

}


/* =========================================================
   EXTRAER TODAS LAS COORDENADAS Y
   DE LOS STAFFLINES
========================================================= */

/*
   IMPORTANTE:

   .StaffLines es un único <path>.

   Por eso querySelectorAll()
   devuelve 1.

   El objetivo ahora es encontrar
   las 5 líneas dentro de su "d".
*/


function extraerYStaffLines(
    svg
) {

    const staff =
        svg.querySelector(
            ".StaffLines"
        );


    if (!staff)
        return [];


    const d =
        staff.getAttribute(
            "d"
        );


    if (!d)
        return [];


    const ys = [];


    /*
    Buscar todos los números.

    No asumimos que el path
    tenga una estructura determinada.
    */

    const numeros =
        d.match(
            /[-+]?(?:\d*\.)?\d+(?:e[-+]?\d+)?/gi
        );


    if (!numeros)
        return [];


    const valores =
        numeros.map(
            Number
        );


    /*
    Las líneas horizontales de un
    pentagrama aparecen como segmentos.

    Buscamos números que se repitan
    como coordenadas Y.

    Para no depender del orden del
    path, agrupamos valores próximos.
    */

    for (
        const v of valores
    ) {

        if (
            !Number.isFinite(v)
        )
            continue;


        let grupo =
            ys.find(
                y =>
                    Math.abs(
                        y -
                        v
                    ) < 1
            );


        if (
            grupo === undefined
        ) {

            ys.push(v);

        }

    }


    /*
    Ordenar.
    */

    ys.sort(
        (a, b) =>
            a - b
    );


    return ys;

}


/* =========================================================
   DETECCIÓN DE LÍNEAS POR GEOMETRÍA
========================================================= */


function detectarLineasStaff(
    svg,
    notas
) {

    /*
    Primero intentamos .StaffLines.
    */

    let ys =
        extraerYStaffLines(
            svg
        );


    /*
    Si no obtenemos suficientes
    valores útiles, reconstruimos
    usando la distribución vertical
    de las cabezas.

    */

    if (
        ys.length < 5
    ) {

        ys =
            detectarLineasDesdeNotas(
                notas
            );

    }


    return ys;

}


/* =========================================================
   RECONSTRUCCIÓN DESDE LAS NOTAS
========================================================= */


function detectarLineasDesdeNotas(
    notas
) {

    if (
        notas.length === 0
    )
        return [];


    /*
    Crear histograma vertical.

    Una nota situada sobre una línea
    produce muchas posiciones
    cercanas a esa línea.

    */

    const bins =
        new Map();


    const paso =
        2;


    for (
        const nota
        of notas
    ) {

        const y =
            Math.round(
                nota.y /
                paso
            ) *
            paso;


        bins.set(
            y,
            (
                bins.get(y) ||
                0
            ) + 1
        );

    }


    const candidatos =
        [
            ...bins.entries()
        ]
        .map(
            ([y, count]) =>
                ({
                    y,
                    count
                })
        )
        .sort(
            (a, b) =>
                b.count -
                a.count
        );


    /*
    Seleccionar posiciones separadas
    aproximadamente por la distancia
    de un espacio de pentagrama.

    Probamos varias escalas.

    */

    const mejores = [];


    for (
        const candidato
        of candidatos
    ) {

        if (
            mejores.every(
                y =>
                    Math.abs(
                        y -
                        candidato.y
                    ) > 10
            )
        ) {

            mejores.push(
                candidato.y
            );

        }


        if (
            mejores.length >= 20
        )
            break;

    }


    mejores.sort(
        (a, b) =>
            a - b
    );


    /*
    Encontrar grupos de 5 líneas
    aproximadamente equidistantes.
    */

    let mejorGrupo =
        null;

    let mejorError =
        Infinity;


    for (
        let i = 0;
        i < mejores.length;
        i++
    ) {

        for (
            let j = i + 1;
            j < mejores.length;
            j++
        ) {

            const distanciaTotal =
                (
                    mejores[j] -
                    mejores[i]
                );


            const espacio =
                distanciaTotal /
                4;


            if (
                espacio < 5 ||
                espacio > 100
            )
                continue;


            const grupo = [];


            for (
                let k = 0;
                k < 5;
                k++
            ) {

                const esperado =
                    mejores[i] +
                    k *
                    espacio;


                let cercano =
                    mejores.reduce(
                        (
                            best,
                            valor
                        ) =>

                            Math.abs(
                                valor -
                                esperado
                            ) <

                            Math.abs(
                                best -
                                esperado
                            )

                                ? valor
                                : best
                        ,
                        mejores[0]
                    );


                grupo.push(
                    cercano
                );

            }


            const unicos =
                [
                    ...new Set(
                        grupo
                    )
                ];


            if (
                unicos.length !== 5
            )
                continue;


            let error = 0;


            for (
                let k = 0;
                k < 5;
                k++
            ) {

                const esperado =
                    mejores[i] +
                    k *
                    espacio;


                error +=
                    Math.abs(
                        grupo[k] -
                        esperado
                    );

            }


            if (
                error <
                mejorError
            ) {

                mejorError =
                    error;

                mejorGrupo =
                    grupo;

            }

        }

    }


    if (
        mejorGrupo
    ) {

        return mejorGrupo.sort(
            (a, b) =>
                a - b
        );

    }


    /*
    Último recurso:
    tomar los 5 picos más separados.
    */

    return mejores.slice(
        0,
        5
    ).sort(
        (a, b) =>
            a - b
    );

}


/* =========================================================
   AGRUPAR PENTAGRAMAS
========================================================= */


function construirPentagramas(
    lineas
) {

    if (
        lineas.length < 5
    )
        return [];


    /*
    Agrupar líneas cuando están
    separadas por aproximadamente
    el mismo espacio.
    */

    const resultado = [];


    let grupo = [];


    for (
        const y
        of lineas
    ) {

        if (
            grupo.length === 0
        ) {

            grupo.push(
                y
            );

            continue;

        }


        if (
            grupo.length === 1
        ) {

            grupo.push(
                y
            );

            continue;

        }


        const espacio =
            grupo[1] -
            grupo[0];


        const esperado =
            grupo[
                grupo.length - 1
            ] +
            espacio;


        if (
            Math.abs(
                y -
                esperado
            ) < 12
        ) {

            grupo.push(
                y
            );

        }
        else {

            if (
                grupo.length >= 5
            ) {

                for (
                    let i = 0;
                    i + 4 <
                    grupo.length;
                    i += 5
                ) {

                    const cinco =
                        grupo.slice(
                            i,
                            i + 5
                        );


                    resultado.push({

                        lineas:
                            cinco,

                        top:
                            cinco[0],

                        bottom:
                            cinco[4],

                        espacio:
                            (
                                cinco[4] -
                                cinco[0]
                            ) /
                            4

                    });

                }

            }


            grupo = [
                y
            ];

        }

    }


    if (
        grupo.length >= 5
    ) {

        for (
            let i = 0;
            i + 4 <
            grupo.length;
            i += 5
        ) {

            const cinco =
                grupo.slice(
                    i,
                    i + 5
                );


            resultado.push({

                lineas:
                    cinco,

                top:
                    cinco[0],

                bottom:
                    cinco[4],

                espacio:
                    (
                        cinco[4] -
                        cinco[0]
                    ) /
                    4

            });

        }

    }


    return resultado;

}


/* =========================================================
   ASIGNAR NOTAS
========================================================= */


function asignarNotas(
    notas,
    pentagramas
) {

    for (
        const nota
        of notas
    ) {

        let mejor =
            null;

        let mejorDist =
            Infinity;


        for (
            let i = 0;
            i < pentagramas.length;
            i++
        ) {

            const p =
                pentagramas[i];


            const centro =
                (
                    p.top +
                    p.bottom
                ) / 2;


            const dist =
                Math.abs(
                    nota.y -
                    centro
                );


            const limite =
                p.espacio *
                7;


            if (
                dist >
                limite
            )
                continue;


            if (
                dist <
                mejorDist
            ) {

                mejorDist =
                    dist;


                mejor = {

                    indice: i,

                    pentagrama: p

                };

            }

        }


        if (
            !mejor
        ) {

            nota.staff =
                null;

            continue;

        }


        nota.staff =
            mejor.indice +
            1;


        const p =
            mejor.pentagrama;


        /*
        Distancia desde la línea
        inferior.

        Cada espacio equivale
        a un paso diatónico.
        */

        const pasosFloat =
            (
                p.bottom -
                nota.y
            ) /
            (
                p.espacio /
                2
            );


        nota.pasos =
            Math.round(
                pasosFloat
            );


        nota.errorVertical =
            Math.abs(
                pasosFloat -
                nota.pasos
            );

    }

}


/* =========================================================
   RENDERIZAR
========================================================= */


function mostrarPagina(
    pagina
) {

    const section =
        document.createElement(
            "section"
        );


    section.className =
        "pagina";


    const h2 =
        document.createElement(
            "h2"
        );


    h2.textContent =

        "Página " +
        pagina.numero +

        " — " +

        pagina.notas.length +
        " cabezas";


    section.appendChild(
        h2
    );


    const info =
        document.createElement(
            "div"
        );


    info.className =
        "info";


    info.innerHTML =

        "<b>Note:</b> " +
        pagina.notePaths +

        " &nbsp; | &nbsp; " +

        "<b>Cabezas:</b> " +
        pagina.notas.length +

        " &nbsp; | &nbsp; " +

        "<b>Líneas detectadas:</b> " +
        pagina.lineas.length +

        " &nbsp; | &nbsp; " +

        "<b>Pentagramas:</b> " +
        pagina.pentagramas.length;


    section.appendChild(
        info
    );


    const wrapper =
        document.createElement(
            "div"
        );


    wrapper.className =
        "svg-wrapper";


    const svg =
        document.importNode(
            pagina.svg,
            true
        );


    wrapper.appendChild(
        svg
    );


    const overlay =
        document.createElement(
            "div"
        );


    overlay.className =
        "overlay";


    let vb =
        svg.getAttribute(
            "viewBox"
        );


    let valores;


    if (vb) {

        valores =
            vb
                .trim()
                .split(
                    /[\s,]+/
                )
                .map(Number);

    }
    else {

        valores = [

            0,
            0,

            numero(
                svg.getAttribute(
                    "width"
                )
            ),

            numero(
                svg.getAttribute(
                    "height"
                )
            )

        ];

    }


    const vx =
        valores[0];

    const vy =
        valores[1];

    const vw =
        valores[2];

    const vh =
        valores[3];


    /*
    Dibujar pentagramas.
    */

    for (
        let i = 0;
        i < pagina.pentagramas.length;
        i++
    ) {

        const p =
            pagina.pentagramas[i];


        for (
            const y
            of p.lineas
        ) {

            const line =
                document.createElement(
                    "div"
                );


            line.className =
                "linea-pentagrama";


            /*
            La línea se extiende
            sobre prácticamente todo
            el ancho del SVG.
            */

            line.style.left =
                "0%";


            line.style.width =
                "100%";


            line.style.top =

                (
                    (
                        y -
                        vy
                    ) /
                    vh *
                    100
                ) +

                "%";


            overlay.appendChild(
                line
            );

        }


        /*
        Etiqueta.
        */

        const label =
            document.createElement(
                "div"
            );


        label.className =
            "pentagrama-label";


        label.textContent =
            "P" +
            (
                i + 1
            );


        label.style.left =
            "0%";


        label.style.top =

            (
                (
                    p.top -
                    vy
                ) /
                vh *
                100
            ) +

            "%";


        overlay.appendChild(
            label
        );

    }


    /*
    Dibujar cabezas.
    */

    for (
        const nota
        of pagina.notas
    ) {

        const marker =
            document.createElement(
                "div"
            );


        marker.className =
            "nota-marker";


        marker.textContent =
            nota.id;


        marker.style.left =

            (
                (
                    nota.x -
                    vx
                ) /
                vw *
                100
            ) +

            "%";


        marker.style.top =

            (
                (
                    nota.y -
                    vy
                ) /
                vh *
                100
            ) +

            "%";


        marker.title =

            "Nota #" +
            nota.id +

            "\nPágina: " +
            nota.pagina +

            "\nX: " +
            nota.x.toFixed(2) +

            "\nY: " +
            nota.y.toFixed(2) +

            "\nPentagrama: " +
            (
                nota.staff ||
                "?"
            ) +

            "\nPasos: " +
            (
                nota.pasos !== undefined
                    ? nota.pasos
                    : "?"
            );


        overlay.appendChild(
            marker
        );

    }


    wrapper.appendChild(
        overlay
    );


    section.appendChild(
        wrapper
    );


    /*
    Tabla de diagnóstico.
    */

    const details =
        document.createElement(
            "details"
        );


    const summary =
        document.createElement(
            "summary"
        );


    summary.textContent =
        "Ver datos detectados";


    details.appendChild(
        summary
    );


    const table =
        document.createElement(
            "table"
        );


    table.innerHTML = `

        <thead>

        <tr>

        <th>ID</th>
        <th>X</th>
        <th>Y</th>
        <th>Pentagrama</th>
        <th>Pasos</th>
        <th>Error</th>

        </tr>

        </thead>

        <tbody></tbody>

    `;


    const tbody =
        table.querySelector(
            "tbody"
        );


    for (
        const nota
        of pagina.notas
    ) {

        const tr =
            document.createElement(
                "tr"
            );


        tr.innerHTML = `

        <td>
            ${nota.id}
        </td>

        <td>
            ${nota.x.toFixed(2)}
        </td>

        <td>
            ${nota.y.toFixed(2)}
        </td>

        <td>
            ${nota.staff || "?"}
        </td>

        <td>
            ${
                nota.pasos !== undefined
                    ? nota.pasos
                    : "?"
            }
        </td>

        <td>
            ${
                nota.errorVertical !== undefined
                    ? nota.errorVertical.toFixed(3)
                    : "?"
            }
        </td>

        `;


        tbody.appendChild(
            tr
        );

    }


    details.appendChild(
        table
    );


    section.appendChild(
        details
    );


    document
        .getElementById(
            "resultado"
        )
        .appendChild(
            section
        );

}


/* =========================================================
   JSON
========================================================= */


function descargarJSON() {

    const datos = {

        titulo:
            "Experience — Ludovico Einaudi",

        totalCabezas:
            todasLasNotas.length,

        paginas:
            paginas.map(
                p => ({

                    pagina:
                        p.numero,

                    lineas:
                        p.lineas,

                    pentagramas:
                        p.pentagramas,

                    notas:
                        p.notas

                })
            )

    };


    const blob =
        new Blob(
            [
                JSON.stringify(
                    datos,
                    null,
                    2
                )
            ],
            {
                type:
                    "application/json"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );


    a.href =
        url;


    a.download =
        "experience_reconstruccion.json";


    a.click();


    setTimeout(
        () =>
            URL.revokeObjectURL(
                url
            ),
        1000
    );

}


/* =========================================================
   ANALIZAR
========================================================= */


async function analizar() {

    const estado =
        document.getElementById(
            "estado"
        );


    estado.textContent =
        "▶ Iniciando reconstrucción...\n";


    document
        .getElementById(
            "resultado"
        )
        .innerHTML = "";


    document
        .getElementById(
            "stats"
        )
        .innerHTML = "";


    paginas = [];

    todasLasNotas = [];

    contadorGlobal = 0;


    try {

        for (
            let i = 0;
            i < ARCHIVOS.length;
            i++
        ) {

            estado.textContent +=

                "\n📄 Página " +
                (
                    i + 1
                ) +
                " / 5";


            const respuesta =
                await fetch(
                    BASE +
                    ARCHIVOS[i],
                    {
                        cache:
                            "no-store"
                    }
                );


            if (
                !respuesta.ok
            ) {

                throw new Error(

                    "HTTP " +
                    respuesta.status +
                    " al cargar " +
                    ARCHIVOS[i]

                );

            }


            const texto =
                await respuesta.text();


            const parser =
                new DOMParser();


            const doc =
                parser.parseFromString(
                    texto,
                    "image/svg+xml"
                );


            const svg =
                doc.documentElement;


            const notas =
                detectarCabezas(
                    svg,
                    i + 1
                );


            estado.textContent +=

                "\n✓ SVG cargado" +

                "\n.Note: " +
                svg.querySelectorAll(
                    ".Note"
                ).length +

                "\nCabezas: " +
                notas.length;


            const lineas =
                detectarLineasStaff(
                    svg,
                    notas
                );


            estado.textContent +=

                "\nLíneas encontradas: " +
                lineas.length;


            const pentagramas =
                construirPentagramas(
                    lineas
                );


            estado.textContent +=

                "\nPentagramas: " +
                pentagramas.length;


            asignarNotas(
                notas,
                pentagramas
            );


            const pagina = {

                numero:
                    i + 1,

                svg,

                notas,

                lineas,

                pentagramas,

                notePaths:
                    svg.querySelectorAll(
                        ".Note"
                    ).length

            };


            paginas.push(
                pagina
            );


            todasLasNotas.push(
                ...notas
            );


            mostrarPagina(
                pagina
            );

        }


        /*
        Estadísticas.
        */

        const conStaff =
            todasLasNotas.filter(
                n =>
                    n.staff !== null &&
                    n.staff !== undefined
            ).length;


        const stats =
            document.getElementById(
                "stats"
            );


        stats.innerHTML = `

        <div class="stat">

            <div class="stat-number">
                ${paginas.length}
            </div>

            <div class="stat-name">
                Páginas
            </div>

        </div>


        <div class="stat">

            <div class="stat-number">
                ${todasLasNotas.length}
            </div>

            <div class="stat-name">
                Cabezas detectadas
            </div>

        </div>


        <div class="stat">

            <div class="stat-number">
                ${paginas.reduce(
                    (a,p) =>
                        a +
                        p.pentagramas.length,
                    0
                )}
            </div>

            <div class="stat-name">
                Pentagramas
            </div>

        </div>


        <div class="stat">

            <div class="stat-number">
                ${conStaff}
            </div>

            <div class="stat-name">
                Notas asignadas
            </div>

        </div>

        `;


        document
            .getElementById(
                "descargar"
            )
            .style.display =
                "inline-block";


        estado.textContent +=

            "\n\n================================" +

            "\n✓ RECONSTRUCCIÓN TERMINADA" +

            "\n================================" +

            "\n\nTotal de cabezas: " +
            todasLasNotas.length +

            "\nNotas asignadas a pentagrama: " +
            conStaff;


    }
    catch(error) {

        console.error(
            error
        );


        estado.textContent +=

            "\n\n❌ ERROR\n\n" +
            error.message;

    }

}


/* =========================================================
   EVENTOS
========================================================= */


document
    .getElementById(
        "analizar"
    )
    .addEventListener(
        "click",
        analizar
    );


document
    .getElementById(
        "descargar"
    )
    .addEventListener(
        "click",
        descargarJSON
    );


</script>
