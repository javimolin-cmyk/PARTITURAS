Las cabezas se detectan directamente desde los SVG de MuseScore.

<script>

"use strict";


/* =========================================================
   CONFIGURACIÓN
========================================================= */

const BASE =
"EXPERIENCE%20-%20%20Ludovico%20Einaudi/";

const ARCHIVOS = [
    "score_0.svg",
    "score_1.svg",
    "score_2.svg",
    "score_3.svg",
    "score_4.svg"
];


let paginas = [];
let todasLasNotas = [];
let contadorGlobal = 0;


/* =========================================================
   UTILIDADES
========================================================= */

function log(texto){

    const estado =
        document.getElementById("estado");

    estado.textContent +=
        texto + "\n";

    estado.scrollTop =
        estado.scrollHeight;
}


function resetLog(){

    document.getElementById("estado")
        .textContent = "";
}


function numero(v){

    const n =
        parseFloat(v);

    return Number.isFinite(n)
        ? n
        : 0;
}


/* =========================================================
   SEPARAR SUBPATHS
========================================================= */

function separarSubpaths(d){

    if(!d)
        return [];

    const posiciones = [];

    const regex =
        /[Mm](?=[-+.\d])/g;

    let match;

    while(
        (match = regex.exec(d))
        !== null
    ){

        posiciones.push(
            match.index
        );
    }

    const resultado = [];

    for(
        let i=0;
        i<posiciones.length;
        i++
    ){

        const inicio =
            posiciones[i];

        const fin =
            i+1 < posiciones.length
            ? posiciones[i+1]
            : d.length;

        const parte =
            d.slice(
                inicio,
                fin
            ).trim();

        if(parte)
            resultado.push(parte);
    }

    return resultado;
}


/* =========================================================
   BBOX DE PATH
========================================================= */

let svgTemporal = null;


function getSVGTemporal(){

    if(svgTemporal)
        return svgTemporal;

    svgTemporal =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "svg"
        );

    svgTemporal.setAttribute(
        "width",
        "10000"
    );

    svgTemporal.setAttribute(
        "height",
        "10000"
    );

    svgTemporal.style.position =
        "absolute";

    svgTemporal.style.left =
        "-100000px";

    svgTemporal.style.top =
        "0";

    svgTemporal.style.visibility =
        "hidden";

    document.body.appendChild(
        svgTemporal
    );

    return svgTemporal;
}


function bboxPath(d){

    try{

        const svg =
            getSVGTemporal();

        const path =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "path"
            );

        path.setAttribute(
            "d",
            d
        );

        svg.appendChild(path);

        const b =
            path.getBBox();

        path.remove();

        return {
            x:b.x,
            y:b.y,
            width:b.width,
            height:b.height,
            cx:b.x+b.width/2,
            cy:b.y+b.height/2
        };

    }catch(e){

        return null;
    }
}


/* =========================================================
   DETECTAR CABEZAS
========================================================= */

function detectarCabezas(
    svg,
    pagina
){

    const elements =
        [
            ...svg.querySelectorAll(
                ".Note"
            )
        ];

    const notas = [];

    for(
        const element
        of elements
    ){

        const d =
            element.getAttribute(
                "d"
            );

        if(!d)
            continue;

        const subpaths =
            separarSubpaths(d);

        for(
            const subpath
            of subpaths
        ){

            if(
                !/[Cc]/.test(
                    subpath
                )
            )
                continue;

            const b =
                bboxPath(
                    subpath
                );

            if(!b)
                continue;

            if(
                b.width < 5 ||
                b.height < 5
            )
                continue;

            if(
                b.width > 100 ||
                b.height > 100
            )
                continue;

            const ratio =
                b.width /
                b.height;

            if(
                ratio < .35 ||
                ratio > 4
            )
                continue;

            notas.push({

                id:
                    ++contadorGlobal,

                pagina,

                x:b.cx,
                y:b.cy,

                width:b.width,
                height:b.height,

                d:subpath
            });
        }
    }

    return notas;
}


/* =========================================================
   NUEVO MÉTODO:
   EXTRAER LAS LÍNEAS REALES DE .StaffLines
========================================================= */

/*
   Este es el cambio importante.

   NO interpretamos los números del atributo "d"
   como coordenadas Y.

   Tomamos el path .StaffLines real y usamos:

       getTotalLength()
       getPointAtLength()

   para recorrer su geometría.

   Así obtenemos los puntos que realmente forman
   las líneas horizontales del pentagrama.
*/


function extraerLineasStaff(svg){

    const staff =
        svg.querySelector(
            ".StaffLines"
        );

    if(!staff)
        return [];

    try{

        const longitud =
            staff.getTotalLength();

        if(!longitud)
            return [];

        /*
          Muestreamos muchas posiciones.
          Esto permite detectar cada segmento
          horizontal independientemente de cómo
          MuseScore haya construido el path.
        */

        const puntos = [];

        const muestras =
            Math.max(
                1000,
                Math.ceil(
                    longitud / 4
                )
            );

        for(
            let i=0;
            i<=muestras;
            i++
        ){

            const distancia =
                longitud *
                i /
                muestras;

            const p =
                staff.getPointAtLength(
                    distancia
                );

            puntos.push({
                x:p.x,
                y:p.y
            });
        }


        /*
          Agrupar Y muy próximos.

          Las cinco líneas reales tendrán
          posiciones Y extremadamente estables.
        */

        const grupos = [];

        for(
            const punto
            of puntos
        ){

            let grupo = null;

            for(
                const g
                of grupos
            ){

                if(
                    Math.abs(
                        g.y -
                        punto.y
                    ) < 1.5
                ){

                    grupo = g;
                    break;
                }
            }

            if(!grupo){

                grupo = {
                    y:punto.y,
                    puntos:[]
                };

                grupos.push(
                    grupo
                );
            }

            grupo.puntos.push(
                punto
            );
        }


        /*
          Convertir grupos en líneas.
        */

        const lineas = [];

        for(
            const grupo
            of grupos
        ){

            if(
                grupo.puntos.length < 3
            )
                continue;

            const xs =
                grupo.puntos.map(
                    p=>p.x
                );

            const x1 =
                Math.min(...xs);

            const x2 =
                Math.max(...xs);

            const width =
                x2-x1;

            /*
              Las líneas de pentagrama son
              largas horizontalmente.
            */

            if(width < 300)
                continue;

            lineas.push({

                y:grupo.y,

                x1,
                x2,

                width
            });
        }


        /*
          Orden vertical.
        */

        lineas.sort(
            (a,b)=>
                a.y-b.y
        );


        /*
          Fusionar grupos duplicados.
        */

        const finales = [];

        for(
            const linea
            of lineas
        ){

            const anterior =
                finales[
                    finales.length-1
                ];

            if(
                anterior &&
                Math.abs(
                    anterior.y -
                    linea.y
                ) < 3
            ){

                anterior.x1 =
                    Math.min(
                        anterior.x1,
                        linea.x1
                    );

                anterior.x2 =
                    Math.max(
                        anterior.x2,
                        linea.x2
                    );

                anterior.width =
                    anterior.x2 -
                    anterior.x1;

                anterior.y =
                    (
                        anterior.y +
                        linea.y
                    ) / 2;

            }else{

                finales.push({
                    ...linea
                });
            }
        }


        return finales;

    }catch(e){

        console.error(
            "Error leyendo StaffLines:",
            e
        );

        return [];
    }
}


/* =========================================================
   AGRUPAR LAS LÍNEAS EN PENTAGRAMAS
========================================================= */

function agruparPentagramas(
    lineas
){

    if(
        lineas.length < 5
    )
        return [];

    const ordenadas =
        [...lineas].sort(
            (a,b)=>
                a.y-b.y
        );


    /*
      Calculamos las separaciones
      entre líneas consecutivas.
    */

    const gaps = [];

    for(
        let i=1;
        i<ordenadas.length;
        i++
    ){

        gaps.push(
            ordenadas[i].y -
            ordenadas[i-1].y
        );
    }


    const positivos =
        gaps.filter(
            x=>x>0
        );

    if(!positivos.length)
        return [];


    const sorted =
        [...positivos].sort(
            (a,b)=>a-b
        );

    const espacioBase =
        sorted[
            Math.floor(
                sorted.length/2
            )
        ];


    /*
      Una separación entre pentagramas
      debe ser considerablemente mayor
      que el espacio entre líneas.
    */

    const separacion =
        Math.max(
            espacioBase * 1.65,
            espacioBase + 8
        );


    const grupos = [];

    let actual = [
        ordenadas[0]
    ];


    for(
        let i=1;
        i<ordenadas.length;
        i++
    ){

        const gap =
            ordenadas[i].y -
            ordenadas[i-1].y;

        if(
            gap > separacion
        ){

            grupos.push(
                actual
            );

            actual = [
                ordenadas[i]
            ];

        }else{

            actual.push(
                ordenadas[i]
            );
        }
    }


    if(actual.length)
        grupos.push(actual);


    /*
      IMPORTANTE:

      Si un grupo contiene exactamente
      5 líneas, es un pentagrama.

      Si contiene más de 5,
      buscamos bloques consecutivos
      de cinco.
    */

    const pentagramas = [];


    for(
        const grupo
        of grupos
    ){

        if(
            grupo.length === 5
        ){

            pentagramas.push(
                crearPentagrama(
                    grupo
                )
            );

            continue;
        }


        if(
            grupo.length > 5
        ){

            /*
              Intentamos encontrar ventanas
              de cinco líneas.

              Esto evita perder líneas
              cuando hay pequeñas anomalías.
            */

            for(
                let i=0;
                i+4<grupo.length;
                i+=5
            ){

                pentagramas.push(
                    crearPentagrama(
                        grupo.slice(
                            i,
                            i+5
                        )
                    )
                );
            }
        }
    }


    /*
      Verificación.

      Si el resultado no coincide con
      bloques de cinco, usamos directamente
      todas las líneas en bloques.
    */

    const bloquesDirectos =
        [];

    for(
        let i=0;
        i+4<ordenadas.length;
        i+=5
    ){

        bloquesDirectos.push(
            crearPentagrama(
                ordenadas.slice(
                    i,
                    i+5
                )
            )
        );
    }


    /*
      Elegimos la interpretación que
      tenga más pentagramas completos.
    */

    if(
        bloquesDirectos.length >
        pentagramas.length
    ){

        return bloquesDirectos;
    }


    return pentagramas;
}


/* =========================================================
   CREAR PENTAGRAMA
========================================================= */

function crearPentagrama(
    lineas
){

    const ordenadas =
        [...lineas].sort(
            (a,b)=>
                a.y-b.y
        );

    const ys =
        ordenadas.map(
            x=>x.y
        );

    const espacio =
        (
            ys[ys.length-1] -
            ys[0]
        ) / 4;


    return {

        lineas:
            ordenadas.map(
                (linea,i)=>({

                    ...linea,

                    indice:i+1
                })
            ),

        top:ys[0],

        bottom:
            ys[ys.length-1],

        center:
            (
                ys[0] +
                ys[ys.length-1]
            ) / 2,

        espacio,

        x1:
            Math.min(
                ...ordenadas.map(
                    x=>x.x1
                )
            ),

        x2:
            Math.max(
                ...ordenadas.map(
                    x=>x.x2
                )
            )
    };
}


/* =========================================================
   ASIGNAR NOTAS A PENTAGRAMAS
========================================================= */

function asignarNotas(
    notas,
    pentagramas
){

    for(
        const nota
        of notas
    ){

        let mejor = null;
        let mejorDist =
            Infinity;


        for(
            let i=0;
            i<pentagramas.length;
            i++
        ){

            const p =
                pentagramas[i];


            /*
              Una nota normalmente está
              dentro del ancho del sistema.
            */

            if(
                nota.x <
                p.x1-100 ||
                nota.x >
                p.x2+100
            )
                continue;


            const margen =
                Math.max(
                    p.espacio*3,
                    25
                );


            let distancia = 0;


            if(
                nota.y <
                p.top-margen
            ){

                distancia =
                    p.top -
                    nota.y;

            }else if(
                nota.y >
                p.bottom+margen
            ){

                distancia =
                    nota.y -
                    p.bottom;
            }


            if(
                distancia <
                mejorDist
            ){

                mejorDist =
                    distancia;

                mejor = {
                    indice:i+1
                };
            }
        }


        if(mejor){

            nota.pentagrama =
                mejor.indice;

            nota.distanciaPentagrama =
                mejorDist;

        }else{

            nota.pentagrama =
                null;

            nota.distanciaPentagrama =
                null;
        }
    }


    return notas;
}


/* =========================================================
   CARGAR SVG
========================================================= */

async function cargarSVG(
    url
){

    const response =
        await fetch(
            url,
            {
                cache:"no-store"
            }
        );


    if(!response.ok){

        throw new Error(
            `HTTP ${response.status}`
        );
    }


    const texto =
        await response.text();


    if(
        !texto.includes("<svg")
    ){

        throw new Error(
            "El archivo no parece ser SVG."
        );
    }


    const parser =
        new DOMParser();


    const doc =
        parser.parseFromString(
            texto,
            "image/svg+xml"
        );


    const svg =
        doc.documentElement;


    if(
        !svg ||
        svg.nodeName.toLowerCase()
        !== "svg"
    ){

        throw new Error(
            "SVG inválido."
        );
    }


    return {
        svg,
        texto
    };
}


/* =========================================================
   MOSTRAR SVG
========================================================= */

function mostrarSVG(
    svg,
    contenedor
){

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "svg-wrapper";


    const copia =
        document.importNode(
            svg,
            true
        );


    copia.removeAttribute(
        "width"
    );

    copia.removeAttribute(
        "height"
    );


    copia.style.width =
        "100%";

    copia.style.height =
        "auto";


    wrapper.appendChild(
        copia
    );


    const overlay =
        document.createElement(
            "div"
        );

    overlay.className =
        "overlay";


    wrapper.appendChild(
        overlay
    );

    contenedor.appendChild(
        wrapper
    );


    return {
        wrapper,
        svg:copia,
        overlay
    };
}


/* =========================================================
   ESCALA
========================================================= */

function obtenerEscala(
    svg,
    wrapper
){

    const vb =
        svg.viewBox.baseVal;


    if(
        vb &&
        vb.width &&
        vb.height
    ){

        return {

            sx:
                wrapper.clientWidth /
                vb.width,

            sy:
                wrapper.clientHeight /
                vb.height,

            ox:
                -vb.x,

            oy:
                -vb.y
        };
    }


    return {

        sx:1,
        sy:1,
        ox:0,
        oy:0
    };
}


/* =========================================================
   DIBUJAR RESULTADO
========================================================= */

function dibujarOverlay(
    pagina
){

    const wrapper =
        pagina.wrapper;

    const overlay =
        pagina.overlay;

    const svg =
        pagina.svg;


    const escala =
        obtenerEscala(
            svg,
            wrapper
        );


    /*
      LÍNEAS AZULES
    */

    for(
        let i=0;
        i<pagina.pentagramas.length;
        i++
    ){

        const p =
            pagina.pentagramas[i];


        for(
            const linea
            of p.lineas
        ){

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "linea-pentagrama";


            div.style.left =
                (
                    (
                        linea.x1 +
                        escala.ox
                    ) *
                    escala.sx
                ) + "px";


            div.style.top =
                (
                    (
                        linea.y +
                        escala.oy
                    ) *
                    escala.sy
                ) + "px";


            div.style.width =
                (
                    linea.width *
                    escala.sx
                ) + "px";


            overlay.appendChild(
                div
            );
        }


        /*
          Etiqueta del pentagrama.
        */

        const label =
            document.createElement(
                "div"
            );

        label.className =
            "pentagrama-label";

        label.textContent =
            "P" + (i+1);


        label.style.left =
            (
                (
                    p.x1 +
                    escala.ox
                ) *
                escala.sx
            ) + "px";


        label.style.top =
            (
                (
                    p.top +
                    escala.oy
                ) *
                escala.sy -
                16
            ) + "px";


        overlay.appendChild(
            label
        );
    }


    /*
      PUNTOS ROJOS
    */

    for(
        const nota
        of pagina.notas
    ){

        const punto =
            document.createElement(
                "div"
            );

        punto.className =
            "nota-marker";


        punto.title =
            `Nota ${nota.id} | ` +
            `P${nota.pentagrama || "?"} | ` +
            `X=${nota.x.toFixed(2)} | ` +
            `Y=${nota.y.toFixed(2)}`;


        punto.style.left =
            (
                (
                    nota.x +
                    escala.ox
                ) *
                escala.sx
            ) + "px";


        punto.style.top =
            (
                (
                    nota.y +
                    escala.oy
                ) *
                escala.sy
            ) + "px";


        overlay.appendChild(
            punto
        );
    }
}


/* =========================================================

function actualizarStats(){

    const pentagramas =

            0

    const asignadas =

    document.getElementById(
        "stats"
    ).innerHTML = `

        <div class="stat">

                Páginas
            </div>
        </div>

        <div class="stat">
            <div class="stat-number">
                ${total}
            </div>
            <div class="stat-name">
                Cabezas detectadas
            </div>
        </div>

        <div class="stat">
            <div class="stat-number">
                ${pentagramas}
            </div>
            <div class="stat-name">
                Pentagramas
            </div>
        </div>

        <div class="stat">
            <div class="stat-number">
                ${asignadas}
            </div>
            <div class="stat-name">
                Notas asignadas
            </div>
        </div>
    `;
}

/* =========================================================
   JSON
========================================================= */

function prepararJSON(){

    return {

        titulo:
            "Experience — Ludovico Einaudi",

        paginas:
            paginas.map(
                pagina=>({

                    numero:
                        pagina.numero,

                    archivo:
                        pagina.archivo,

                    cabezas:
                        pagina.notas.map(
                            n=>({

                                id:n.id,

                                x:n.x,

                                y:n.y,

                                width:
                                    n.width,

                                height:
                                    n.height,

                                pentagrama:
                                    n.pentagrama
                            })
                        ),

                    pentagramas:
                        pagina.pentagramas.map(
                            (p,i)=>({

                                numero:
                                    i+1,

                                top:p.top,

                                bottom:
                                    p.bottom,

                                espacio:
                                    p.espacio,

                                x1:p.x1,

                                x2:p.x2,

                                lineas:
                                    p.lineas.map(
                                        l=>({

                                            y:l.y,

                                            x1:l.x1,

                                            x2:l.x2,

                                            width:
                                                l.width
                                        })
                                    )
                            })
                        )
                })
            )
    };
}


function descargarJSON(){

    const contenido =
        JSON.stringify(
            prepararJSON(),
            null,
            2
        );


    const blob =
        new Blob(
            [contenido],
            {
                type:
                    "application/json"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );


    a.href=url;

    a.download =
        "experience_reconstruccion.json";


    a.click();


    setTimeout(
        ()=>{
            URL.revokeObjectURL(
                url
            );
        },
        1000
    );
}


/* =========================================================
   ANÁLISIS PRINCIPAL
========================================================= */

async function analizar(){

    const boton =
        document.getElementById(
            "analizar"
        );

    const resultado =
        document.getElementById(
            "resultado"
        );


    boton.disabled=true;

    document.getElementById(
        "descargar"
    ).style.display =
        "none";


    resultado.innerHTML="";

    paginas=[];

    todasLasNotas=[];

    contadorGlobal=0;

    resetLog();


    log(
        "▶ Iniciando reconstrucción...\n"
    );


    try{

        for(
            let i=0;
            i<ARCHIVOS.length;
            i++
        ){

            const numeroPagina =
                i+1;

            const archivo =
                ARCHIVOS[i];

            const url =
                BASE + archivo;


            log(
                `📄 Página ${numeroPagina} / ${ARCHIVOS.length}`
            );


            log(
                `   ${url}`
            );


            log(
                "   Descargando..."
            );


            const cargado =
                await cargarSVG(
                    url
                );


            const svg =
                cargado.svg;


            log(
                `   ✓ SVG cargado — ${cargado.texto.length} caracteres`
            );


            const noteElements =
                svg.querySelectorAll(
                    ".Note"
                ).length;


            log(
                `   .Note: ${noteElements}`
            );


            /*
              CABEZAS
            */

            const notas =
                detectarCabezas(
                    svg,
                    numeroPagina
                );


            log(
                `   🔴 Cabezas: ${notas.length}`
            );


            /*
              STAFF LINES
            */

            const lineas =
                extraerLineasStaff(
                    svg
                );


            log(
                `   📏 Líneas StaffLines reales: ${lineas.length}`
            );


            /*
              PENTAGRAMAS
            */

            const pentagramas =
                agruparPentagramas(
                    lineas
                );


            log(
                `   🎼 Pentagramas: ${pentagramas.length}`
            );


            /*
              ASIGNACIÓN
            */

            asignarNotas(
                notas,
                pentagramas
            );


            const asignadas =
                notas.filter(
                    n=>n.pentagrama
                ).length;


            log(
                `   ✓ Notas asignadas: ${asignadas}`
            );


            paginas.push({

                numero:
                    numeroPagina,

                archivo,

                svg,

                notas,

                lineas,

                pentagramas,

                noteElements
            });


            todasLasNotas.push(
                ...notas
            );


            log("");
        }


        log(
            "================================"
        );

        log(
            "✓ RECONSTRUCCIÓN TERMINADA"
        );

        log(
            "================================"
        );


        log(
            `Total de cabezas: ${todasLasNotas.length}`
        );


        log(
            `Total de líneas: ${
                paginas.reduce(
                    (s,p)=>
                        s+p.lineas.length,
                    0
                )
            }`
        );


        log(
            `Total de pentagramas: ${
                paginas.reduce(
                    (s,p)=>
                        s+p.pentagramas.length,
                    0
                )
            }`
        );


        log(
            `Total asignadas: ${
                todasLasNotas.filter(
                    n=>n.pentagrama
                ).length
            }`
        );


        actualizarStats();


        /*
          Mostrar las páginas.
        */

        for(
            const pagina
            of paginas
        ){

            const contenedor =
                document.createElement(
                    "section"
                );


            contenedor.className =
                "pagina";


            const titulo =
                document.createElement(
                    "h2"
                );


            titulo.textContent =
                `Página ${pagina.numero} — ` +
                `${pagina.notas.length} cabezas`;


            contenedor.appendChild(
                titulo
            );


            const info =
                document.createElement(
                    "div"
                );


            info.className="info";


            info.innerHTML = `

                <b>Note:</b>
                ${pagina.noteElements}

                &nbsp; | &nbsp;

                <b>Cabezas:</b>
                ${pagina.notas.length}

                &nbsp; | &nbsp;

                <b>Líneas:</b>
                ${pagina.lineas.length}

                &nbsp; | &nbsp;

                <b>Pentagramas:</b>
                ${pagina.pentagramas.length}

                &nbsp; | &nbsp;

                <b>Asignadas:</b>
                ${
                    pagina.notas.filter(
                        n=>n.pentagrama
                    ).length
                }
            `;


            contenedor.appendChild(
                info
            );


            resultado.appendChild(
                contenedor
            );


            const visual =
                mostrarSVG(
                    pagina.svg,
                    contenedor
                );


            pagina.wrapper =
                visual.wrapper;

            pagina.svgMostrado =
                visual.svg;

            pagina.overlay =
                visual.overlay;


            /*
              Esperar a que el navegador
              calcule las dimensiones.
            */

            requestAnimationFrame(
                ()=>{
                    dibujarOverlay(
                        pagina
                    );
                }
            );


            contenedor.insertAdjacentHTML(
                "beforeend",
                diagnostico(
                    pagina
                )
            );
        }


        document.getElementById(
            "descargar"
        ).style.display =
            "inline-block";


    }catch(error){

        log("");
        log(
            "❌ ERROR"
        );

        log(
            error.message ||
            String(error)
        );

        console.error(
            error
        );

    }finally{

        boton.disabled=false;
    }
}


/* =========================================================
   EVENTOS
========================================================= */

document.getElementById(
    "analizar"
).addEventListener(
    "click",
    analizar
);


document.getElementById(
    "descargar"
).addEventListener(
    "click",
    descargarJSON
);

</script>
