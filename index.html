<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<title>Diagnóstico Notes SVG</title>

<style>

body {
    background:#202020;
    color:white;
    font-family:Arial;
    padding:30px;
}

button {
    padding:12px 20px;
    font-size:16px;
    cursor:pointer;
}

pre {
    background:#111;
    padding:20px;
    overflow:auto;
    white-space:pre-wrap;
}

.pagina {
    background:white;
    color:black;
    margin:30px 0;
    padding:20px;
}

svg {
    width:100%;
}

</style>

</head>

<body>

<h1>Diagnóstico real de las Note</h1>

<button onclick="analizar()">
🔎 ANALIZAR NOTE
</button>

<pre id="resultado">
Esperando...
</pre>

<script>

const CARPETA =
"EXPERIENCE%20-%20%20Ludovico%20Einaudi/";

const ARCHIVOS = [
"score_0.svg",
"score_1.svg",
"score_2.svg",
"score_3.svg",
"score_4.svg"
];


async function cargarSVG(nombre) {

    const r =
        await fetch(
            CARPETA + nombre
        );

    if (!r.ok) {

        throw new Error(
            nombre +
            " HTTP " +
            r.status
        );

    }

    return await r.text();

}


function extraerNumerosPath(d) {

    /*
    Extrae todos los números
    del atributo d.

    Esto permite estudiar
    directamente la geometría
    del path.
    */

    if (!d)
        return [];

    const coincidencias =
        d.match(
            /[-+]?(?:\d*\.\d+|\d+\.?\d*)(?:[eE][-+]?\d+)?/g
        );

    if (!coincidencias)
        return [];

    return coincidencias.map(
        Number
    );

}


function resumenPath(path) {

    const d =
        path.getAttribute("d")
        || "";


    const numeros =
        extraerNumerosPath(d);


    let minX = Infinity;
    let maxX = -Infinity;

    let minY = Infinity;
    let maxY = -Infinity;


    /*
    ATENCIÓN:

    En un path SVG los números
    no necesariamente son pares
    X,Y porque existen comandos
    con distintos números de
    argumentos.

    Por eso aquí solamente
    mostramos los números y
    NO fingimos todavía que
    son coordenadas.

    */

    return {

        longitudD:
            d.length,

        cantidadNumeros:
            numeros.length,

        primerosNumeros:
            numeros.slice(
                0,
                40
            ),

        d:

            d.length > 2000
                ? d.slice(0,2000) +
                  "\n...[TRUNCADO]"
                : d

    };

}


async function analizar() {

    let salida = "";


    for (
        let pagina = 0;
        pagina < ARCHIVOS.length;
        pagina++
    ) {

        const texto =
            await cargarSVG(
                ARCHIVOS[pagina]
            );


        const parser =
            new DOMParser();


        const doc =
            parser.parseFromString(
                texto,
                "image/svg+xml"
            );


        const svg =
            doc.documentElement;


        const notas =
            [
                ...svg.querySelectorAll(
                    ".Note"
                )
            ];


        salida +=
            "\n\n====================================\n";

        salida +=
            "PÁGINA " +
            (pagina + 1) +
            "\n";

        salida +=
            "NOTES: " +
            notas.length +
            "\n";

        salida +=
            "====================================\n";


        for (
            let i = 0;
            i < notas.length;
            i++
        ) {

            const nota =
                notas[i];


            const datos =
                resumenPath(
                    nota
                );


            salida +=
                "\n\n--- NOTE " +
                (i + 1) +
                " ---\n";


            salida +=
                "tag: " +
                nota.tagName +
                "\n";


            salida +=
                "class: " +
                nota.getAttribute(
                    "class"
                ) +
                "\n";


            salida +=
                "fill: " +
                nota.getAttribute(
                    "fill"
                ) +
                "\n";


            salida +=
                "stroke: " +
                nota.getAttribute(
                    "stroke"
                ) +
                "\n";


            salida +=
                "stroke-width: " +
                nota.getAttribute(
                    "stroke-width"
                ) +
                "\n";


            salida +=
                "longitud d: " +
                datos.longitudD +
                "\n";


            salida +=
                "cantidad números: " +
                datos.cantidadNumeros +
                "\n";


            salida +=
                "primeros números:\n" +
                JSON.stringify(
                    datos.primerosNumeros
                );


            salida +=
                "\n\nPATH d:\n" +
                datos.d;

        }

    }


    document
        .getElementById(
            "resultado"
        )
        .textContent =
            salida;

}

</script>

</body>
</html>
