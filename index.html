<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Experience — Partitura PNG</title>

  <style>
    body {
      margin: 0;
      padding: 30px;
      background: #222;
      font-family: Arial, sans-serif;
      color: white;
    }

    h1 {
      text-align: center;
    }

    #estado {
      max-width: 1000px;
      margin: 20px auto;
      padding: 15px;
      background: #333;
      border-radius: 8px;
      white-space: pre-wrap;
    }

    .pagina {
      max-width: 1400px;
      margin: 30px auto;
      background: white;
      padding: 20px;
      color: black;
      box-shadow: 0 3px 15px rgba(0,0,0,.4);
    }

    .pagina h2 {
      margin-top: 0;
    }

    .pagina img {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid #ccc;
    }

    .botones {
      margin-top: 15px;
    }

    button {
      padding: 10px 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      margin-right: 8px;
    }

    .descargar {
      background: #1976d2;
      color: white;
    }

    .original {
      background: #555;
      color: white;
    }
  </style>
</head>

<body>

<h1>Experience — Ludovico Einaudi</h1>

<div id="estado">
  Iniciando...
</div>

<div id="partituras"></div>


<script>

const CARPETA =
  "EXPERIENCE%20-%20%20Ludovico%20Einaudi/";

const ARCHIVOS = [
  "score_0.svg",
  "score_1.svg",
  "score_2.svg",
  "score_3.svg",
  "score_4.svg"
];

const estado =
  document.getElementById("estado");

const contenedor =
  document.getElementById("partituras");


/*
==========================================================
CARGAR SVG
==========================================================
*/

async function cargarSVG(nombre) {

  const url =
    CARPETA +
    nombre;

  const respuesta =
    await fetch(url);

  if (!respuesta.ok) {

    throw new Error(
      nombre +
      " → HTTP " +
      respuesta.status
    );
  }

  return await respuesta.text();
}


/*
==========================================================
OBTENER DIMENSIONES DEL SVG
==========================================================
*/

function dimensionesSVG(svgTexto) {

  const parser =
    new DOMParser();

  const documento =
    parser.parseFromString(
      svgTexto,
      "image/svg+xml"
    );

  const svg =
    documento.documentElement;

  let width =
    parseFloat(
      svg.getAttribute("width")
    );

  let height =
    parseFloat(
      svg.getAttribute("height")
    );

  /*
  Si no hay width/height,
  usamos viewBox.
  */

  if (
    (!width || !height) &&
    svg.hasAttribute("viewBox")
  ) {

    const vb =
      svg.getAttribute("viewBox")
        .trim()
        .split(/\s+/)
        .map(Number);

    if (vb.length === 4) {

      width = vb[2];
      height = vb[3];
    }
  }

  /*
  Valores de seguridad.
  */

  if (!width)
    width = 1600;

  if (!height)
    height = 2200;

  return {
    width,
    height
  };
}


/*
==========================================================
SVG → PNG
==========================================================
*/

function convertirPNG(
  svgTexto,
  nombre
) {

  return new Promise(
    (resolve, reject) => {

      const dimensiones =
        dimensionesSVG(
          svgTexto
        );

      /*
      Creamos un Blob SVG.
      */

      const blob =
        new Blob(
          [svgTexto],
          {
            type:
              "image/svg+xml"
          }
        );

      const url =
        URL.createObjectURL(
          blob
        );

      const imagen =
        new Image();

      imagen.onload =
        function() {

          /*
          Factor de resolución.

          2 = buena calidad
          3 = alta calidad
          */

          const escala = 3;

          const canvas =
            document.createElement(
              "canvas"
            );

          canvas.width =
            Math.round(
              dimensiones.width *
              escala
            );

          canvas.height =
            Math.round(
              dimensiones.height *
              escala
            );

          const contexto =
            canvas.getContext(
              "2d"
            );

          /*
          Fondo blanco.
          */

          contexto.fillStyle =
            "white";

          contexto.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
          );

          /*
          Dibujar SVG.
          */

          contexto.drawImage(
            imagen,
            0,
            0,
            canvas.width,
            canvas.height
          );

          /*
          Convertir a PNG.
          */

          canvas.toBlob(
            function(png) {

              URL.revokeObjectURL(
                url
              );

              if (!png) {

                reject(
                  new Error(
                    "No se pudo crear PNG"
                  )
                );

                return;
              }

              resolve(png);

            },
            "image/png"
          );
        };

      imagen.onerror =
        function() {

          URL.revokeObjectURL(
            url
          );

          reject(
            new Error(
              "No se pudo rasterizar " +
              nombre
            )
          );
        };

      imagen.src =
        url;
    }
  );
}


/*
==========================================================
MOSTRAR PÁGINA
==========================================================
*/

async function procesarPagina(
  nombre,
  numero
) {

  estado.textContent =
    `Procesando página ${
      numero + 1
    } de ${
      ARCHIVOS.length
    }...\n\n` +
    nombre;

  /*
  Cargar SVG.
  */

  const svg =
    await cargarSVG(
      nombre
    );

  /*
  Convertir SVG a PNG.
  */

  const png =
    await convertirPNG(
      svg,
      nombre
    );

  /*
  URL temporal del PNG.
  */

  const pngURL =
    URL.createObjectURL(
      png
    );

  /*
  Crear contenedor.
  */

  const pagina =
    document.createElement(
      "section"
    );

  pagina.className =
    "pagina";

  /*
  Título.
  */

  const titulo =
    document.createElement(
      "h2"
    );

  titulo.textContent =
    "Página " +
    (numero + 1);

  pagina.appendChild(
    titulo
  );

  /*
  Imagen PNG.
  */

  const imagen =
    document.createElement(
      "img"
    );

  imagen.src =
    pngURL;

  imagen.alt =
    "Partitura página " +
    (numero + 1);

  pagina.appendChild(
    imagen
  );

  /*
  Botones.
  */

  const botones =
    document.createElement(
      "div"
    );

  botones.className =
    "botones";

  /*
  Descargar PNG.
  */

  const descargarPNG =
    document.createElement(
      "button"
    );

  descargarPNG.className =
    "descargar";

  descargarPNG.textContent =
    "⬇ Descargar PNG";

  descargarPNG.onclick =
    function() {

      const enlace =
        document.createElement(
          "a"
        );

      enlace.href =
        pngURL;

      enlace.download =
        "experience-pagina-" +
        (numero + 1) +
        ".png";

      enlace.click();
    };

  botones.appendChild(
    descargarPNG
  );

  /*
  Descargar SVG original.
  */

  const descargarSVG =
    document.createElement(
      "button"
    );

  descargarSVG.className =
    "original";

  descargarSVG.textContent =
    "⬇ Descargar SVG original";

  descargarSVG.onclick =
    function() {

      const blob =
        new Blob(
          [svg],
          {
            type:
              "image/svg+xml"
          }
        );

      const url =
        URL.createObjectURL(
          blob
        );

      const enlace =
        document.createElement(
          "a"
        );

      enlace.href =
        url;

      enlace.download =
        nombre;

      enlace.click();

      setTimeout(
        () =>
          URL.revokeObjectURL(
            url
          ),
        1000
      );
    };

  botones.appendChild(
    descargarSVG
  );

  pagina.appendChild(
    botones
  );

  contenedor.appendChild(
    pagina
  );

  return pngURL;
}


/*
==========================================================
PROCESAR LAS CINCO PÁGINAS
==========================================================
*/

async function iniciar() {

  try {

    for (
      let i = 0;
      i < ARCHIVOS.length;
      i++
    ) {

      await procesarPagina(
        ARCHIVOS[i],
        i
      );
    }

    estado.textContent =
      "✓ TERMINADO\n\n" +
      "Las cinco páginas fueron " +
      "convertidas a PNG.\n\n" +
      "Ahora las partituras están " +
      "rasterizadas como imágenes " +
      "PNG de alta resolución.";

  }
  catch(error) {

    console.error(error);

    estado.textContent =
      "❌ ERROR\n\n" +
      error.message;
  }
}


iniciar();

</script>

</body>
</html>
