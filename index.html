<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Diagnóstico SVG — Experience</title>

<style>
body {
    margin: 0;
    padding: 30px;
    background: #202020;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 1400px;
    margin: auto;
}

button {
    padding: 12px 18px;
    font-size: 16px;
    cursor: pointer;
    border: 0;
    border-radius: 7px;
    margin: 5px;
}

#analizar {
    background: #4caf50;
    color: white;
}

#resultado {
    margin-top: 20px;
    background: #111;
    padding: 20px;
    border-radius: 8px;
    font-family: monospace;
    white-space: pre-wrap;
    overflow-x: auto;
}

.pagina {
    background: white;
    padding: 20px;
    margin-top: 30px;
}

svg {
    width: 100%;
    height: auto;
}
</style>
</head>

<body>

<div class="container">

<h1>Diagnóstico SVG — Experience</h1>

<button id="analizar">
🔎 ANALIZAR ESTRUCTURA DE LOS SVG
</button>

<div id="resultado">
Esperando...
</div>

<div id="partituras"></div>

</div>


<script>

const CARPETA =
"EXPERIENCE%20-%20%20Ludovico%20Einaudi/";

const ARCHIVOS = [
"score_0.svg",
"score_1.svg",
"score_2.svg",
"score_3.svg",
"score_4.svg"
];


async function cargar(nombre) {

    const respuesta =
        await fetch(
            CARPETA + nombre
        );

    if (!respuesta.ok) {

        throw new Error(
            nombre +
            " → HTTP " +
            respuesta.status
        );

    }

    return await respuesta.text();

}


function analizarSVG(texto) {

    const parser =
        new DOMParser();

    const doc =
        parser.parseFromString(
            texto,
            "image/svg+xml"
        );

    const svg =
        doc.documentElement;


    const elementos =
        [
            ...svg.querySelectorAll("*")
        ];


    const tipos = {};

    const clases = {};

    const ids = {};

    const atributos = {};

    const textos = [];



    for (
        const elemento of elementos
    ) {

        const nombre =
            elemento.tagName;

        tipos[nombre] =
            (tipos[nombre] || 0) + 1;


        const clase =
            elemento.getAttribute(
                "class"
            );

        if (clase) {

            clases[clase] =
                (clases[clase] || 0) + 1;

        }


        const id =
            elemento.getAttribute(
                "id"
            );

        if (id) {

            ids[id] =
                (ids[id] || 0) + 1;

        }


        for (
            const atributo
            of elemento.attributes
        ) {

            atributos[
                atributo.name
            ] =
                (
                    atributos[
                        atributo.name
                    ] || 0
                ) + 1;

        }


        if (
            elemento.tagName ===
            "text"
        ) {

            const texto =
                elemento.textContent
                    .trim();

            if (texto) {

                textos.push(
                    texto
                );

            }

        }

    }


    return {
        elementos,
        tipos,
        clases,
        ids,
        atributos,
        textos
    };

}



function formatearObjeto(
    titulo,
    objeto,
    limite = 100
) {

    let salida =
        "\n\n" +
        "===== " +
        titulo +
        " =====\n";


    const entradas =
        Object.entries(
            objeto
        )
        .sort(
            (a,b) =>
                b[1] -
                a[1]
        )
        .slice(
            0,
            limite
        );


    for (
        const [clave, cantidad]
        of entradas
    ) {

        salida +=
            cantidad +
            " × " +
            clave +
            "\n";

    }


    return salida;

}



async function analizar() {

    const resultado =
        document.getElementById(
            "resultado"
        );

    resultado.textContent =
        "Analizando...";


    let informe = "";


    for (
        let i = 0;
        i < ARCHIVOS.length;
        i++
    ) {

        const nombre =
            ARCHIVOS[i];


        try {

            const texto =
                await cargar(
                    nombre
                );


            const datos =
                analizarSVG(
                    texto
                );


            informe +=
                "\n\n\n" +
                "########################################\n" +
                "PÁGINA " +
                (i + 1) +
                "\n" +
                "########################################\n";


            informe +=
                "\nTotal elementos: " +
                datos.elementos.length;


            informe +=
                formatearObjeto(
                    "TIPOS DE ELEMENTOS",
                    datos.tipos
                );


            informe +=
                formatearObjeto(
                    "CLASES",
                    datos.clases
                );


            informe +=
                formatearObjeto(
                    "ATRIBUTOS",
                    datos.atributos
                );


            informe +=
                "\n\nTEXTOS EN SVG:\n";


            informe +=
                datos.textos
                    .slice(0,100)
                    .join(
                        "\n"
                    );


            /*
            Mostrar SVG.
            */

            const pagina =
                document.createElement(
                    "div"
                );

            pagina.className =
                "pagina";


            const parser =
                new DOMParser();


            const documento =
                parser.parseFromString(
                    texto,
                    "image/svg+xml"
                );


            pagina.appendChild(
                document.importNode(
                    documento.documentElement,
                    true
                )
            );


            document
                .getElementById(
                    "partituras"
                )
                .appendChild(
                    pagina
                );


        }
        catch(error) {

            informe +=
                "\nERROR EN " +
                nombre +
                ": " +
                error.message;

        }

    }


    resultado.textContent =
        informe;

}


document
.getElementById(
    "analizar"
)
.addEventListener(
    "click",
    analizar
);

</script>

</body>
</html>
